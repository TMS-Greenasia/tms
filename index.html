            <div class="a4-box-title">Consignee / Bill To</div>
            <table class="a4-kv">
              <tr><td class="lbl">Name</td><td class="sep">:</td><td class="val">${E(i.cust)}</td></tr>
              <tr><td class="lbl">Address</td><td class="sep">:</td><td class="val">${E(cInfo.al || '-')}</td></tr>
            </table>
          </div>
          <div class="a4-box">
            <div class="a4-box-title">Invoice Details</div>
            <table class="a4-kv">
              <tr><td class="lbl">No Invoice</td><td class="sep">:</td><td class="val">${E(i.no)}</td></tr>
              <tr><td class="lbl">Tgl Invoice</td><td class="sep">:</td><td class="val">${E(i.tgl)}</td></tr>
              <tr><td class="lbl">Jatuh Tempo</td><td class="sep">:</td><td class="val">${E(i.due)}</td></tr>
              <tr><td class="lbl">TOP</td><td class="sep">:</td><td class="val">${E(i.term ?? M.set.term)} Hari</td></tr>
            </table>
          </div>
        </div>

        <table class="a4-items">
          <thead>
            <tr>
              <th class="c" style="width:28px">No.</th>
              <th style="width:74px">Id booking</th>
              <th style="width:78px">Container</th>
              <th class="c" style="width:36px">Size</th>
              <th style="width:52px">Status</th>
              <th style="width:78px">Dari</th>
              <th style="width:82px">Tujuan</th>
              <th class="n" style="width:72px">TARIF TRUCKING</th>
              <th class="n" style="width:62px">TARIF LOLO</th>
              <th class="n" style="width:76px">TOTAL</th>
            </tr>
          </thead>
          <tbody>
            ${rowHtml}
            <tr>
              <td colspan="7" class="n">Subtotal (DPP)</td>
              <td colspan="3" class="n">${fmtInvRp(S0)}</td>
            </tr>
            <tr>
              <td colspan="7" class="n">PPN ${M.set.ppn}%</td>
              <td colspan="3" class="n">${fmtInvRp(P)}</td>
            </tr>
            ${Hh ? `<tr><td colspan="7" class="n">PPh 23 (${M.set.pph}%)</td><td colspan="3" class="n">− ${fmtInvRp(Hh)}</td></tr>` : ''}
            <tr class="a4-grand-row">
              <td colspan="7" class="n">Grand Total</td>
              <td colspan="3" class="n">${fmtInvRp(i.total)}</td>
            </tr>
          </tbody>
        </table>

        <div class="a4-terbilang">
          <b>Terbilang:</b> <i>${E(terbilangId(i.total))}</i>
        </div>

        <div class="a4-bottom">
          <div class="a4-pay">
            <b class="hd-pay">PAYMENT INFORMATION:</b>
            <div>Bank: <b>${E(CO.bank)}</b></div>
            <div>No Rekening: <b>${E(CO.norek)}</b></div>
            <div>Atas Nama: <b>${E(CO.an)}</b></div>
          </div>
          <div class="a4-sign">
            <div>Petugas Finance</div>
            <div class="a4-sign-space"></div>
            <div class="a4-sign-line">( ${E(CO.finance)} )</div>
          </div>
        </div>

        <div class="a4-foot">
          <span>Page 1/1 · ${E(CO.n)}</span>
          <span>Dicetak: ${nowWib()}</span>
        </div>
      </div>

      <div class="row np" style="margin-top:12px">
        <button class="b" onclick="window.print()">🖨️ Cetak / Simpan PDF (A4)</button>
        <button class="b g" onclick="closeM()">Tutup</button>
      </div>`);
    }

    function cst() {
      M.custList = M.custList || [];
      return `<div class="card">
        <div class="row" style="margin-bottom:8px">
          <h2 style="margin:0">Data Customer / Pemilik Order</h2>
          <div style="margin-left:auto">${exportBtnsHtml('cst')}</div>
        </div>
        <div class="row" style="margin-bottom:12px">
          <label>Nama Customer / Pemilik Order<input id="c_n" placeholder="PT. ..."></label>
          <label style="flex:2">Alamat Penagihan<input id="c_al" placeholder="Alamat lengkap penagihan"></label>
          <button class="b o" onclick="saveCst()">+ Simpan Customer</button>
        </div>
        <div class="tw"><table>
          <tr><th>Nama Customer</th><th>Alamat Penagihan</th><th></th></tr>
          ${M.custList.map((c, i) => `<tr>
            <td><b>${E(c.n)}</b></td>
            <td>${E(c.al || '-')}</td>
            <td>${isSA() ? `<button class="b s r" onclick="M.custList.splice(${i},1);pm();rr()">Hapus</button>` : ''}</td>
          </tr>`).join('') || '<tr><td colspan="3" class="hint">Belum ada data customer.</td></tr>'}
        </table></div>
      </div>`;
    }

    function saveCst() {
      const n = $('c_n').value.trim(), al = $('c_al').value.trim();
      if (!n) return showToast('Isi nama customer.');
      M.custList = M.custList || [];
      const ex = M.custList.find(x => x.n.toLowerCase() == n.toLowerCase());
      if (ex) ex.al = al;
      else M.custList.push({ n, al });
      if (!M.custs.includes(n)) M.custs.push(n);
      pm(); rr();
      showToast('Data customer tersimpan.');
    }

    /* =========================================================================
       MASTER DATA & PENGATURAN USER (SUPERADMIN)
       ========================================================================= */
    const SCH = {
      drv: { t: 'driver', l: 'drivers', f: [['n', 'Nama driver'], ['hp', 'No. telepon'], ['plat', 'No. polisi'], ['us', 'Username'], ['pw', 'Password', 'p']] },
      trk: { t: 'unit truk & STNK', l: 'trucks', f: [['plat', 'No. polisi'], ['jenis', 'Jenis unit'], ['stnk', 'No. STNK'], ['pajakDue', 'Tgl Pajak Tahunan (YYYY-MM-DD)'], ['stnkDue', 'Berlaku STNK 5-Th (YYYY-MM-DD)']] },
      rt: { t: 'rute & tarif', l: 'routes', f: [['jenis', 'Jenis (Import/Export/Repo)'], ['term', 'Terminal'], ['t', 'Alamat Tujuan'], ['depo', 'Depo Empty'], ...TIPE.map((x, i) => ['c' + i, 'Ongkos ' + x, 'n']), ...TIPE.map((x, i) => ['u' + i, 'Uang jalan ' + x, 'n'])] }
    };

    function ed(k, i) {
      const s = SCH[k], r = i < 0 ? { jenis: 'Import', pajakDue: today(), stnkDue: today() } : cl(M[s.l][i]);
      if (k == 'rt') TIPE.forEach((_, j) => { r['c' + j] = (r.c || [])[j]; r['u' + j] = (r.u || [])[j]; });
      modal(`<h2>${i < 0 ? 'Tambah' : 'Edit'} ${s.t}</h2>
      <div class="row">${s.f.map(f => `<label>${f[1]}<input id="e_${f[0]}" type="${f[2] == 'n' ? 'number' : f[2] == 'p' ? 'password' : f[0].endsWith('Due') ? 'date' : 'text'}" value="${f[2] == 'p' ? '' : E(r[f[0]] ?? '')}" ${f[2] == 'p' ? `placeholder="${i < 0 ? 'wajib diisi' : 'kosongkan jika tidak diganti'}"` : ''}></label>`).join('')}</div>
      <div class="row" style="margin-top:12px"><button class="b" onclick="sv('${k}',${i})">Simpan</button><button class="b g" onclick="closeM()">Batal</button></div>`);
    }

    async function sv(k, i) {
      const s = SCH[k], o = i < 0 ? {} : cl(M[s.l][i]);
      for (const f of s.f) {
        const v = $('e_' + f[0]).value.trim();
        if (f[2] == 'p') { if (v) o.pw = await H(v); }
        else o[f[0]] = f[2] == 'n' ? +v || 0 : v;
      }
      const first = s.f[0][0];
      if (!o[first] || (k == 'rt' && (!o.term || !o.depo))) return showToast('Lengkapi data wajib.');
      if (k == 'drv') { if (!o.us || !o.plat) return showToast('Username dan no. polisi wajib diisi.'); if (i < 0 && !o.pw) return showToast('Password wajib diisi.'); if (i < 0) o.id = 'D' + Date.now(); }
      if (k == 'rt') { o.jenis = ['Import', 'Export', 'Repo'].includes(o.jenis) ? o.jenis : 'Import'; if (o.jenis === 'Repo' && !o.t) o.t = 'Repo Container'; o.c = TIPE.map((_, j) => o['c' + j] || 0); o.u = TIPE.map((_, j) => o['u' + j] || 0); TIPE.forEach((_, j) => { delete o['c' + j]; delete o['u' + j]; }); }
      if (i < 0) M[s.l].push(o);
      else M[s.l][i] = o;
      pm(); closeM();
      showToast('Data master tersimpan.');
    }

    function rm(k, i) {
      if (!isSA()) return;
      M[SCH[k].l].splice(i, 1);
      pm(); rr();
      showToast('Data master dihapus.');
    }

    const eb = (k, i) => `<button class="b s g" onclick="ed('${k}',${i})">Edit</button>${isSA() ? ` <button class="b s r" onclick="rm('${k}',${i})">Hapus</button>` : ''}`;

    function mst() {
      return `<div class="card">
        <div class="row" style="margin-bottom:8px">
          <h2 style="margin:0">Unit Truk & Masa Berlaku STNK / Pajak</h2>
          <div style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">
            ${exportBtnsHtml('mst')}
            <button class="b s o" onclick="ed('trk',-1)">+ Unit truk</button>
          </div>
        </div>
        <div class="tw"><table>
          <tr><th>No. Polisi</th><th>Jenis</th><th>No. STNK</th><th>Tgl Pajak Tahunan</th><th>Masa Berlaku STNK</th><th>Status</th><th></th></tr>
          ${M.trucks.map((d, i) => {
            const dp = diffDays(d.pajakDue), ds = diffDays(d.stnkDue);
            let stTag = '<span class="tag" style="background:var(--ok);color:#fff">Aktif</span>';
            if (dp < 0 || ds < 0) stTag = '<span class="tag" style="background:var(--bad);color:#fff">EXPIRED</span>';
            else if (dp <= 30 || ds <= 30) stTag = `<span class="tag" style="background:var(--ac2);color:#1b1206">Jatuh Tempo (${Math.min(dp, ds)} hr)</span>`;
            return `<tr><td><b>${E(d.plat)}</b></td><td>${E(d.jenis)}</td><td>${E(d.stnk || '-')}</td><td>${E(d.pajakDue || '-')}</td><td>${E(d.stnkDue || '-')}</td><td>${stTag}</td><td>${eb('trk', i)}</td></tr>`;
          }).join('')}
        </table></div>
      </div>

      <div class="card">
        <div class="row"><h2 style="margin:0">Driver</h2><button class="b s o" style="margin-left:auto" onclick="ed('drv',-1)">+ Driver</button></div>
        <div class="tw"><table>
          <tr><th>Nama</th><th>No. telepon</th><th>No. polisi</th><th>Username</th><th></th></tr>
          ${M.drivers.map((d, i) => `<tr><td>${E(d.n)}</td><td>${E(d.hp)}</td><td>${E(d.plat)}</td><td>${E(d.us)}</td><td>${eb('drv', i)}</td></tr>`).join('')}
        </table></div>
      </div>

      <div class="card">
        <div class="row"><h2 style="margin:0">Tarif Rute (Import, Export & Repo)</h2><button class="b s o" style="margin-left:auto" onclick="ed('rt',-1)">+ Rute</button></div>
        <div class="tw"><table>
          <tr><th>Jenis</th><th>Terminal</th><th>Alamat Tujuan</th><th>Depo Empty</th><th class="n">Ongkos 20ft</th><th class="n">Ongkos 40ft</th><th class="n">Uang jalan 20ft</th><th class="n">Uang jalan 40ft</th><th></th></tr>
          ${M.routes.map((r, i) => {
            const j = r.jenis || 'Import';
            return `<tr><td><span class="tag ${jClass(j)}">${E(jLabel(j))}</span></td><td>${E(r.term || r.a)}</td><td>${E(r.t)}</td><td>${E(r.depo || '-')}</td><td class="n">${R(r.c[0])}</td><td class="n">${R(r.c[1])}</td><td class="n">${R(r.u[0])}</td><td class="n">${R(r.u[1])}</td><td>${eb('rt', i)}</td></tr>`;
          }).join('')}
        </table></div>
      </div>`;
    }

    function cfg() {
      if (!isSA()) return '<div class="card"><p class="bad">Menu Pengaturan hanya dapat diakses oleh Superadmin.</p></div>';
      return `<div class="card">
        <h2>Pengaturan Akun User & Hak Akses (Superadmin)</h2>
        <p class="hint">Tambah, ubah password/role, atau hapus akun pengguna sistem (Superadmin, Admin Ops, Kasir). Akun Driver dikelola di menu Master.</p>
        <div class="route-box" style="margin-bottom:14px">
          <div class="route-flow" style="margin-bottom:6px">Tambah User Baru</div>
          <div class="row">
            <label>Nama Lengkap<input id="u_new_n" placeholder="Contoh: Budi Finance"></label>
            <label>Username Login<input id="u_new_us" placeholder="Contoh: budi_ops"></label>
            <label>Password<input type="password" id="u_new_pw" placeholder="Minimal 6 karakter"></label>
            <label style="max-width:190px">Pilihan Role Akses<select id="u_new_role">
              <option value="admin">Admin Ops (Operasional)</option>
              <option value="kasir">Kasir (Invoice & Top-Up)</option>
              <option value="superadmin">Superadmin (Akses Penuh)</option>
            </select></label>
            <button class="b o" onclick="addSystemUser()">+ Tambah User</button>
          </div>
        </div>
        <div class="tw"><table>
          <tr><th>Nama Lengkap</th><th>Username</th><th>Role Akses</th><th>Aksi</th></tr>
          ${(M.users || []).map((u, idx) => `<tr>
            <td><b>${E(u.n)}</b>${u.us === me.us ? ' <span class="tag st-Dispatch">Sedang Login</span>' : ''}</td>
            <td><code>${E(u.us)}</code></td>
            <td><span class="tag ${u.role === 'superadmin' ? 'jn-Repo' : u.role === 'kasir' ? 'jn-Export' : 'jn-Import'}">${E(u.role.toUpperCase())}</span></td>
            <td>
              <button class="b s g" onclick="openEditUser(${idx})">Edit / Reset Password</button>
              ${u.us !== me.us ? `<button class="b s r" onclick="delSystemUser(${idx})">Hapus</button>` : '<span class="hint">Akun aktif</span>'}
            </td>
          </tr>`).join('')}
        </table></div>
      </div>`;
    }

    async function addSystemUser() {
      if (!isSA()) return;
      const n = $('u_new_n').value.trim();
      const us = $('u_new_us').value.trim().toLowerCase();
      const pwRaw = $('u_new_pw').value;
      const role = $('u_new_role').value;
      if (!n || !us || !pwRaw) return showToast('Lengkapi Nama, Username, dan Password.');
      if (M.users.some(x => x.us.toLowerCase() === us) || M.drivers.some(x => x.us.toLowerCase() === us)) {
        return showToast('Username sudah digunakan, pilih username lain.');
      }
      const pw = await H(pwRaw);
      M.users.push({ us, pw, role, n });
      pm(); rr();
      showToast(`User ${n} (${role}) berhasil ditambahkan.`);
    }

    function openEditUser(idx) {
      if (!isSA()) return;
      const u = M.users[idx];
      if (!u) return;
      modal(`<h2>Edit Akun User · ${E(u.n)}</h2>
      <div class="row">
        <label>Nama Lengkap<input id="eu_n" value="${E(u.n)}"></label>
        <label>Username<input id="eu_us" value="${E(u.us)}"></label>
      </div>
      <div class="row" style="margin-top:8px">
        <label>Role Akses<select id="eu_role">
          <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin Ops</option>
          <option value="kasir" ${u.role === 'kasir' ? 'selected' : ''}>Kasir</option>
          <option value="superadmin" ${u.role === 'superadmin' ? 'selected' : ''}>Superadmin</option>
        </select></label>
        <label>Password Baru (Kosongkan jika tidak diubah)<input type="password" id="eu_pw" placeholder="Isi untuk ganti password"></label>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="b" onclick="saveEditUser(${idx})">Simpan Perubahan</button>
        <button class="b g" onclick="closeM()">Batal</button>
      </div>`);
    }

    async function saveEditUser(idx) {
      if (!isSA()) return;
      const u = M.users[idx];
      const n = $('eu_n').value.trim();
      const us = $('eu_us').value.trim().toLowerCase();
      const role = $('eu_role').value;
      const pwRaw = $('eu_pw').value;
      if (!n || !us) return showToast('Nama dan username wajib diisi.');
      if (M.users.some((x, i) => i !== idx && x.us.toLowerCase() === us)) return showToast('Username sudah dipakai akun lain.');
      u.n = n; u.us = us; u.role = role;
      if (pwRaw) u.pw = await H(pwRaw);
      pm(); closeM();
      showToast('Data user berhasil diperbarui.');
    }

    function delSystemUser(idx) {
      if (!isSA()) return;
      const u = M.users[idx];
      if (!u || u.us === me.us) return showToast('Tidak dapat menghapus akun yang sedang digunakan.');
      M.users.splice(idx, 1);
      pm(); rr();
      showToast(`User ${u.n} telah dihapus.`);
    }

    window.addEventListener('DOMContentLoaded', boot);
  </script>
</body>
</html>
