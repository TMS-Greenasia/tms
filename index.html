<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Greenasia TMS v4.1 – PT. Greenasia Tunas Raya</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
  <style>
    /* =========================================================================
       VARIABEL TEMA & ADAPTASI LIGHT/DARK MODE
       ========================================================================= */
    :root {
      --bg: #eceae4;
      --sf: #fbfaf7;
      --tx: #1d2428;
      --mu: #667178;
      --ln: #d5d2c8;
      --ac: #0e5a5a;
      --ac2: #e8820c;
      --ok: #2f7d3e;
      --bad: #b3392b;
      --hd: #17262b;
      --hdt: #f1efe8;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #12181b;
        --sf: #1a2226;
        --tx: #e8e6df;
        --mu: #8d989e;
        --ln: #2d3a40;
        --ac: #4fb3ae;
        --ac2: #f09a35;
        --ok: #6cc27c;
        --bad: #ef7a6b;
        --hd: #0b1113;
        --hdt: #e8e6df;
      }
    }

    :root[data-theme="dark"] {
      --bg: #12181b;
      --sf: #1a2226;
      --tx: #e8e6df;
      --mu: #8d989e;
      --ln: #2d3a40;
      --ac: #4fb3ae;
      --ac2: #f09a35;
      --ok: #6cc27c;
      --bad: #ef7a6b;
      --hd: #0b1113;
      --hdt: #e8e6df;
    }

    * { box-sizing: border-box; }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.45 Barlow, system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* =========================================================================
       HEADER & NAVIGASI UTAMA
       ========================================================================= */
    header {
      background: var(--hd);
      color: var(--hdt);
      padding: 10px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .brand-box { display: flex; flex-direction: column; }
    h1 {
      font: 700 22px 'Barlow Condensed', sans-serif;
      letter-spacing: .02em;
      margin: 0;
      line-height: 1.05;
    }
    .brand-sub { font-size: 11px; opacity: .75; }

    nav { display: flex; gap: 2px; flex-wrap: wrap; }
    nav button {
      background: none;
      border: 0;
      color: var(--hdt);
      opacity: .72;
      padding: 7px 10px;
      font: 600 13.5px Barlow, sans-serif;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      border-radius: 4px 4px 0 0;
    }
    nav button:hover { opacity: .95; }
    nav button.on { opacity: 1; border-color: var(--ac2); background: rgba(255,255,255,.06); }

    .who {
      margin-left: auto;
      font-size: 13px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .bell {
      background: var(--ac2);
      color: #1b1206;
      border-radius: 10px;
      padding: 2px 9px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .bell.bad { background: var(--bad); color: #fff; }
    .wib-clock {
      font-variant-numeric: tabular-nums;
      background: rgba(255,255,255,.1);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
    }

    /* =========================================================================
       KARTU, STATISTIK, TABEL, FORM & TOMBOL
       ========================================================================= */
    main { max-width: 1240px; margin: 0 auto; padding: 16px; width: 100%; }
    .card {
      background: var(--sf);
      border: 1px solid var(--ln);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 14px;
    }
    h2 { font: 700 21px 'Barlow Condensed', sans-serif; margin: 0 0 10px; }
    h3 { font: 600 15px Barlow, sans-serif; margin: 14px 0 6px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }

    .stat {
      flex: 1;
      min-width: 150px;
      border-left: 4px solid var(--ac);
      padding: 4px 12px;
      background: var(--bg);
      border-radius: 0 4px 4px 0;
    }
    .stat b { display: block; font: 700 22px 'Barlow Condensed', sans-serif; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--mu); font-size: 12.5px; }
    .stat.warn { border-left-color: var(--ac2); }
    .stat.bad { border-left-color: var(--bad); }
    .stat.ok { border-left-color: var(--ok); }

    .tw { overflow-x: auto; width: 100%; }
    table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
    th {
      text-align: left;
      color: var(--mu);
      font-weight: 600;
      border-bottom: 2px solid var(--ln);
      padding: 7px 8px;
      white-space: nowrap;
    }
    td { border-bottom: 1px solid var(--ln); padding: 7px 8px; vertical-align: middle; }
    td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }

    label { display: flex; flex-direction: column; font-size: 13px; color: var(--mu); gap: 3px; flex: 1; min-width: 140px; }
    input, select, textarea {
      font: inherit;
      color: var(--tx);
      background: var(--bg);
      border: 1px solid var(--ln);
      border-radius: 4px;
      padding: 7px 8px;
      width: 100%;
    }
    td input { padding: 4px 6px; }
    :focus-visible { outline: 2px solid var(--ac2); outline-offset: 1px; }

    .b {
      font: 600 13.5px Barlow, sans-serif;
      border: 1px solid var(--ac);
      background: var(--ac);
      color: #fff;
      border-radius: 4px;
      padding: 7px 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }
    .b.g { background: none; color: var(--ac); }
    .b.o { background: var(--ac2); border-color: var(--ac2); color: #1b1206; }
    .b.s { padding: 4px 8px; font-size: 12.5px; }
    .b.r { background: none; border-color: var(--bad); color: var(--bad); }
    header .b.g { color: var(--hdt); border-color: rgba(255,255,255,.35); }

    .tag {
      display: inline-block;
      font-size: 11.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--ln);
      color: var(--tx);
    }
    .st-Booking { background: #d9dde0; color: #2a3338; }
    .st-Dispatch { background: #c8dff0; color: #0f3d5f; }
    .st-Selesai { background: #d9d0ef; color: #3a2670; }
    .st-Ditagih { background: #2f7d3e; color: #fff; }
    .st-Batal { background: #b3392b; color: #fff; }
    .jn-Import { background: #d4e8f7; color: #0b426e; }
    .jn-Export { background: #fde2c4; color: #6e3604; }
    .jn-Repo { background: #e4d9f7; color: #3f1d75; }

    .pipe { display: flex; gap: 6px; margin: 10px 0 14px; flex-wrap: wrap; }
    .pipe span {
      flex: 1;
      min-width: 90px;
      text-align: center;
      font-size: 12px;
      padding: 6px;
      border-bottom: 4px solid var(--ln);
      color: var(--mu);
    }
    .pipe .d { border-color: var(--ac); color: var(--tx); }
    .pipe .c { border-color: var(--ac2); color: var(--tx); font-weight: 700; }

    /* =========================================================================
       MODAL, TOAST, FLEET CARDS & DRIVER WORKFLOW
       ========================================================================= */
    #mw {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: none;
      overflow: auto;
      padding: 14px;
      z-index: 30;
    }
    #mw.on { display: block; }
    #md {
      background: var(--sf);
      max-width: 940px;
      margin: 0 auto;
      border-radius: 6px;
      padding: 18px;
      border: 1px solid var(--ln);
    }

    .tot { margin-left: auto; max-width: 350px; width: 100%; }
    .tot div { display: flex; justify-content: space-between; padding: 3px 0; }
    .tot .g { border-top: 2px solid var(--tx); font-weight: 700; font-size: 17px; margin-top: 4px; padding-top: 6px; }
    .hint { color: var(--mu); font-size: 12.5px; }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }

    .tile {
      border: 1px solid var(--ln);
      border-left: 5px solid var(--ac2);
      border-radius: 5px;
      padding: 10px 12px;
      flex: 1;
      min-width: 220px;
      background: var(--bg);
    }
    .tile.t2 { border-left-color: var(--ac); }
    .tile b { display: block; margin-bottom: 4px; }

    .dc {
      border: 1px solid var(--ln);
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 12px;
      background: var(--sf);
    }
    .dc.new { border-color: var(--ac2); border-width: 2px; }
    .dc.locked { opacity: .75; background: var(--bg); }
    .dc.wizard { border-color: var(--ac); border-width: 2px; }

    .login { max-width: 390px; margin: 10vh auto; padding: 0 16px; }
    #toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: var(--ac2);
      color: #1b1206;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      display: none;
      z-index: 50;
      box-shadow: 0 4px 16px rgba(0,0,0,.25);
    }

    .route-box {
      background: var(--bg);
      border: 1px solid var(--ln);
      border-radius: 6px;
      padding: 10px 12px;
      margin-top: 10px;
    }
    .route-flow { font-size: 13px; font-weight: 600; color: var(--ac); margin-bottom: 6px; }

    .pbox {
      border: 1px dashed var(--ln);
      border-radius: 6px;
      padding: 10px;
      background: var(--bg);
      flex: 1;
      min-width: 210px;
    }
    .pbox img {
      max-width: 100%;
      max-height: 170px;
      border-radius: 4px;
      margin-top: 8px;
      display: block;
      border: 1px solid var(--ln);
      cursor: zoom-in;
    }
    .pgrid { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
    .pitem {
      border: 1px solid var(--ln);
      border-radius: 6px;
      padding: 8px;
      background: var(--bg);
      max-width: 240px;
    }
    .pitem img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 4px;
      cursor: zoom-in;
      display: block;
      margin-top: 4px;
    }

    .drv-rep {
      border: 1px solid var(--ln);
      border-left: 5px solid var(--ac);
      background: var(--bg);
      border-radius: 6px;
      padding: 10px 12px;
      margin: 10px 0;
    }
    .drv-rep.warn { border-left-color: var(--bad); }

    .step-bar { display: flex; gap: 6px; margin: 10px 0 14px; flex-wrap: wrap; }
    .step-bar div {
      flex: 1;
      min-width: 130px;
      padding: 7px 10px;
      border-radius: 5px;
      border: 1px solid var(--ln);
      background: var(--bg);
      font-size: 12.5px;
      color: var(--mu);
    }
    .step-bar div.done { border-color: var(--ok); color: var(--ok); font-weight: 600; }
    .step-bar div.act { border-color: var(--ac2); background: rgba(232,130,12,.12); color: var(--tx); font-weight: 700; }

    .fleet-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-top: 8px; }
    .f-card {
      border: 1px solid var(--ln);
      border-radius: 6px;
      padding: 10px 12px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .f-card.active { border-left: 5px solid var(--ac2); }
    .f-card.standby { border-left: 5px solid var(--ok); }
    .f-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .f-meta { font-size: 12px; color: var(--mu); line-height: 1.4; }
    .doc-box {
      border: 1px solid var(--ln);
      border-left: 4px solid var(--ac);
      background: var(--bg);
      border-radius: 5px;
      padding: 9px 12px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* =========================================================================
       KOP SURAT & INVOICE A4 (PRESISI MARGIN KERTAS A4)
       ========================================================================= */
    .kop-box {
      border-bottom: 2px solid #2d573e;
      padding-bottom: 8px;
      margin-bottom: 12px;
      text-align: right;
      font-family: Arial, sans-serif;
      color: #111;
    }
    .kop-co {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 700;
      font-size: 19px;
      color: #27533b;
      letter-spacing: .3px;
      margin-bottom: 2px;
    }
    .kop-addr { font-size: 10.5px; line-height: 1.4; color: #222; }

    .a4-inv {
      width: 100%;
      max-width: 186mm;
      margin: 0 auto;
      background: #fff;
      color: #111;
      padding: 6mm 8mm;
      border: 1px solid #d0d5dd;
      font-family: Arial, sans-serif;
      font-size: 11px;
    }
    .a4-top-meta { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
    .a4-title { font-size: 20px; font-weight: 700; letter-spacing: 1px; color: #1b3b2b; margin: 0; }
    .a4-order-no { font-size: 11px; font-weight: 700; color: #333; margin-top: 2px; }
    .a4-info-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 10px; margin-bottom: 10px; }
    .a4-box { border: 1px solid #cbd5e1; border-radius: 3px; padding: 7px 9px; background: #fcfdfb; }
    .a4-box-title {
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      color: #27533b;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 3px;
      margin-bottom: 5px;
    }
    .a4-kv { width: 100%; border-collapse: collapse; font-size: 10.5px; }
    .a4-kv td { padding: 1.5px 2px; border: 0; vertical-align: top; }
    .a4-kv td.lbl { width: 92px; color: #475569; font-weight: 600; }
    .a4-kv td.sep { width: 8px; }
    .a4-kv td.val { color: #0f172a; font-weight: 600; word-break: break-word; }

    .a4-items {
      width: 100%;
      border-collapse: collapse;
      font-size: 10px;
      table-layout: fixed;
      margin-bottom: 10px;
    }
    .a4-items th {
      background: #27533b;
      color: #fff;
      font-weight: 700;
      padding: 5px 4px;
      border: 1px solid #27533b;
      text-align: left;
      white-space: normal;
      word-break: break-word;
    }
    .a4-items td {
      padding: 5px 4px;
      border: 1px solid #cbd5e1;
      color: #111;
      vertical-align: top;
      word-break: break-word;
    }
    .a4-items th.n, .a4-items td.n { text-align: right; font-variant-numeric: tabular-nums; }
    .a4-items th.c, .a4-items td.c { text-align: center; }
    .a4-grand-row td { background: #eef6f1; font-weight: 700; font-size: 11px; color: #143624; border-top: 2px solid #27533b; }

    .a4-terbilang {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-left: 4px solid #27533b;
      padding: 5px 8px;
      font-size: 10.5px;
      margin-bottom: 10px;
    }
    .a4-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; margin-top: 8px; flex-wrap: wrap; }
    .a4-pay { border: 1px solid #cbd5e1; border-radius: 3px; padding: 7px 10px; background: #fcfdfb; font-size: 10.5px; min-width: 240px; }
    .a4-pay b.hd-pay { display: block; color: #27533b; font-size: 10px; margin-bottom: 4px; text-transform: uppercase; }
    .a4-sign { text-align: center; min-width: 170px; font-size: 10.5px; }
    .a4-sign-space { height: 48px; }
    .a4-sign-line { border-top: 1px solid #334155; padding-top: 3px; font-weight: 700; }
    .a4-foot {
      margin-top: 10px;
      padding-top: 5px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      font-size: 9.5px;
      color: #64748b;
    }

    @page { size: A4 portrait; margin: 10mm; }
    @media print {
      body * { visibility: hidden; }
      #mw, #mw * { visibility: visible; }
      #mw { position: static; background: none; padding: 0; overflow: visible; }
      #md { max-width: none; width: 100%; margin: 0; padding: 0; border: 0; box-shadow: none; background: #fff; }
      .a4-inv { max-width: 100%; width: 100%; padding: 0; border: 0; }
      .np { display: none !important; }
      :root { --sf: #fff; --tx: #000; --bg: #fff; --mu: #444; --ln: #bbb; }
    }
  </style>
</head>
<body>
  <div id="root"><main><p>Memuat aplikasi Greenasia TMS v4.1…</p></main></div>
  <div id="mw"><div id="md"></div></div>
  <div id="toast"></div>

  <script>
    /* =========================================================================
       KONSTANTA MASTER, FORMAT WAKTU WIB & HELPER UTILITAS
       ========================================================================= */
    const TIPE = ['Trailer 20ft', 'Trailer 40ft', 'Flatbed', 'Lowbed'];
    const ST = ['Booking', 'Dispatch', 'Selesai', 'Ditagih'];
    const CO = {
      n: 'PT. GREENASIA TUNAS RAYA',
      a: 'JL.KEBON BAWANG VII NO.73, Desa/Kelurahan Kebon Bawang, Kec. Tanjung Priok, Kota Adm. Jakarta Utara, Provinsi DKI Jakarta, Kode Pos: 14320',
      web: 'www.greenasia.co.id',
      email: 'finance@greenasia.co.id',
      bank: 'BCA',
      norek: '6910778143',
      an: 'PT. GREENASIA TUNAS RAYA',
      finance: 'ENI'
    };

    const KOP_HTML = `<div class="kop-box">
      <div class="kop-co">${CO.n}</div>
      <div class="kop-addr">
        JL.KEBON BAWANG VII NO.73, Desa/Kelurahan Kebon Bawang,<br>
        Kec. Tanjung Priok, Kota Adm. Jakarta Utara, Provinsi DKI Jakarta,<br>
        Kode Pos: 14320 web: ${CO.web} Email: ${CO.email}
      </div>
    </div>`;

    const R = n => 'Rp ' + Math.round(+n || 0).toLocaleString('id-ID');
    const Rplain = n => 'Rp. ' + Math.round(+n || 0).toLocaleString('en-US');
    const E = s => String(s ?? '').replace(/[&<>'"]/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[c]));
    const $ = id => document.getElementById(id);

    const getWibParts = (dt = new Date()) => {
      const s = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Asia/Jakarta',
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: false
      }).format(dt);
      const [dPart, tPart] = s.split(', ');
      const [dd, mm, yyyy] = dPart.split('/');
      return {
        iso: `${yyyy}-${mm}-${dd}`,
        dmy: `${dd}/${mm}/${yyyy}`,
        time: tPart,
        full: `${dd}/${mm}/${yyyy} ${tPart} WIB`
      };
    };

    const today = () => getWibParts().iso;
    const nowWib = () => getWibParts().full;
    const addDays = (dStr, days) => {
      const [y, m, d] = dStr.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d + days, 12, 0, 0));
      return getWibParts(dt).iso;
    };
    const diffDays = targetStr => {
      if (!targetStr) return 999;
      const [y1, m1, d1] = today().split('-').map(Number);
      const [y2, m2, d2] = targetStr.split('-').map(Number);
      return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000);
    };

    const parseWibToDate = wibStr => {
      if (!wibStr) return null;
      const m = String(wibStr).match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2}):(\d{2})/);
      if (!m) return null;
      return new Date(`${m[3]}-${m[2]}-${m[1]}T${m[4]}:${m[5]}:${m[6]}+07:00`);
    };

    const fmtElapsed = wibStr => {
      const start = parseWibToDate(wibStr);
      if (!start || isNaN(start.getTime())) return 'Sedang berjalan';
      const diffMin = Math.max(1, Math.round((Date.now() - start.getTime()) / 60000));
      const jam = Math.floor(diffMin / 60);
      const mnt = diffMin % 60;
      return jam > 0 ? `${jam} jam ${mnt} mnt` : `${mnt} menit`;
    };

    const estEndWib = (wibStr, jenis) => {
      const base = parseWibToDate(wibStr) || new Date();
      const addMin = jenis === 'Repo' ? 150 : 270;
      const est = new Date(base.getTime() + addMin * 60000);
      return getWibParts(est).time + ' WIB';
    };

    const cl = x => JSON.parse(JSON.stringify(x));
    function sha256Fallback(ascii) {
      const rightRotate = (v, a) => (v >>> a) | (v << (32 - a));
      const maxWord = Math.pow(2, 32), words = [];
      let result = '', asciiBitLength = ascii.length * 8;
      let hash = sha256Fallback.h = sha256Fallback.h || [];
      let k = sha256Fallback.k = sha256Fallback.k || [];
      let primeCounter = k.length, isComposite = {};
      for (let candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
          hash[primeCounter] = (Math.pow(candidate, .5) * maxWord) | 0;
          k[primeCounter++] = (Math.pow(candidate, 1 / 3) * maxWord) | 0;
        }
      }
      ascii += '\x80';
      while (ascii.length % 64 - 56) ascii += '\x00';
      for (let i = 0; i < ascii.length; i++) {
        const j = ascii.charCodeAt(i);
        words[i >> 2] |= j << ((3 - i) % 4) * 8;
      }
      words[words.length] = ((asciiBitLength / maxWord) | 0);
      words[words.length] = (asciiBitLength);
      let h = hash.slice(0, 8);
      for (let j = 0; j < words.length;) {
        const w = words.slice(j, j += 16), oldHash = h.slice(0);
        for (let i = 0; i < 64; i++) {
          const w15 = w[i - 15], w2 = w[i - 2];
          const a = h[0], e = h[4];
          const temp1 = h[7]
            + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
            + ((e & h[5]) ^ ((~e) & h[6])) + k[i]
            + (w[i] = (i < 16) ? w[i] : (
              w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
              + w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
            ) | 0);
          const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
            + ((a & h[1]) ^ (a & h[2]) ^ (h[1] & h[2]));
          h = [(temp1 + temp2) | 0].concat(h);
          h[4] = (h[4] + temp1) | 0;
          h.pop();
        }
        for (let i = 0; i < 8; i++) h[i] = (h[i] + oldHash[i]) | 0;
      }
      for (let i = 0; i < 8; i++) {
        for (let j = 3; j + 1; j--) {
          const b = (h[i] >> (j * 8)) & 255;
          result += ((b < 16) ? 0 : '') + b.toString(16);
        }
      }
      return result;
    }

    async function apiReq(url, opts = {}) {
      let action = '';
      let payload = opts.body ? JSON.parse(opts.body) : {};
      let method = 'POST';

      if (url === '/api/health') { action = 'health'; method = 'GET'; }
      else if (url === '/api/auth/login') { action = 'login'; }
      else if (url === '/api/auth/logout') { action = 'logout'; }
      else if (url === '/api/bootstrap') { action = 'bootstrap'; method = 'GET'; }
      else if (url === '/api/master') { action = 'saveMaster'; }
      else if (url.startsWith('/api/orders/') && (opts.method || 'PUT') === 'PUT') {
        action = 'saveOrder';
        payload = { ...payload, spk: decodeURIComponent(url.replace('/api/orders/', '')) };
      } else if (url.startsWith('/api/orders/') && opts.method === 'DELETE') {
        action = 'deleteOrder';
        payload = { spk: decodeURIComponent(url.replace('/api/orders/', '')) };
      } else if (url.startsWith('/api/invoices/')) {
        action = 'saveInvoice';
        payload = { ...payload, id: decodeURIComponent(url.replace('/api/invoices/', '')) };
      }

      const tok = getApiToken();
      const headers = { 'Content-Type': 'application/json' };
      if (tok) {
        headers['Authorization'] = 'Bearer ' + tok;
        headers['X-Api-Token'] = tok;
      }

      const fetchUrl = `${API_ENDPOINT}?action=${encodeURIComponent(action)}${method === 'GET' ? '&_t=' + Date.now() : ''}`;
      const fetchOpts = { method, headers, cache: 'no-store' };
      if (method === 'POST') fetchOpts.body = JSON.stringify(payload);

      const res = await fetch(fetchUrl, fetchOpts);
      const rawText = await res.text();
      let data = {};
      try {
        data = rawText ? JSON.parse(rawText) : {};
      } catch (e) {
        throw new Error('Respons server bukan JSON valid.');
      }
      if (!res.ok || data.ok === false) {
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      return data;
    }

    function compressImg(file, maxW = 800, q = 0.7) {
      return new Promise((resolve, reject) => {
        if (!file) return resolve('');
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }
            const cv = document.createElement('canvas');
            cv.width = w; cv.height = h;
            cv.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(cv.toDataURL('image/jpeg', q));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function readAttachedFile(file) {
      return new Promise((resolve, reject) => {
        if (!file) return resolve(null);
        const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
        if (isPdf) {
          if (file.size > 4 * 1024 * 1024) return reject(new Error('Ukuran PDF maksimal 4 MB.'));
          const reader = new FileReader();
          reader.onload = e => resolve({
            name: file.name,
            mime: 'application/pdf',
            kind: 'pdf',
            sizeKb: Math.round(file.size / 1024),
            dataUrl: e.target.result,
            uploadedAt: nowWib()
          });
          reader.onerror = reject;
          reader.readAsDataURL(file);
        } else {
          compressImg(file, 900, 0.75).then(dataUrl => resolve({
            name: file.name,
            mime: 'image/jpeg',
            kind: 'image',
            sizeKb: Math.round((dataUrl.length * 0.75) / 1024),
            dataUrl,
            uploadedAt: nowWib()
          })).catch(reject);
        }
      });
    }

    function verifySession() {
      let tok = null;
      try { tok = sessionStorage.getItem('tms_tok'); } catch (e) {}
      if (!tok || !tok.includes(':')) return null;
      const [u, sig] = tok.split(':');
      const a = M.users.find(x => x.us == u && x.pw.slice(0, 16) == sig);
      if (a) return { role: a.role, us: a.us, n: a.n };
      const d = M.drivers.find(x => x.us.toLowerCase() == u && x.pw.slice(0, 16) == sig);
      if (d) return { role: 'driver', us: d.us, id: d.id, n: d.n };
      return null;
    }

    function rr() {
      const r = $('root');
      if (!M) return;
      if (!me && !useBackend) me = verifySession();
      if (!me) {
        if (!$('lu')) {
          r.innerHTML = `<div class="login card">
            <h2>${CO.n}</h2>
            <p class="hint">${E(CO.a)}</p>
            <label>Username<input id="lu" autocomplete="username"></label>
            <label style="margin-top:10px">Password<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"></label>
            <p class="bad" id="le"></p>
            <button class="b" onclick="login()">Masuk</button>

          </div>`;
        }
        return;
      }

      const nav = NAVS[me.role];
      if (!nav.some(n => n[0] == view)) view = nav[0][0];

      let bell = '';
      if (me.role == 'driver') {
        const n = unseen().length;
        bell = n ? `<span class="bell" onclick="go('drv')">🔔 ${n} baru</span>` : '';
        if (n > lastBell) showToast('Order baru masuk ke daftar tugas Anda.');
        lastBell = n;
      }
      if (['admin', 'superadmin'].includes(me.role)) {
        const sa = stnkAlerts().length;
        if (sa) bell += `<span class="bell bad" onclick="go('mst')">🚨 ${sa} STNK/Pajak</span>`;
      }
      if (['kasir', 'superadmin'].includes(me.role)) {
        const ov = overdueInvs().length;
        if (ov) bell += `<span class="bell bad" onclick="go('inv')">⚠️ ${ov} Jatuh Tempo</span>`;
      }

      const views = { dash, ord, upl, mnt, rek, rpt, pnl, inv, kas, cst, mst, cfg, drv };
      r.innerHTML = `<header>
        <div class="brand-box">
          <h1>GREENASIA TMS</h1>
          <span class="brand-sub">PT. GREENASIA TUNAS RAYA · TANJUNG PRIOK</span>
        </div>
        <nav>${nav.map(n => `<button class="${n[0] == view ? 'on' : ''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}</nav>
        <span class="who">
          <span id="wib_clk" class="wib-clock">${nowWib()}</span>
          ${bell}
          <span>${E(me.n)} · <b>${E(me.role)}</b></span>
          ${useBackend ? '<button class="b g s" onclick="syncNow()" title="Muat ulang data terbaru dari server">🔄 Sync</button>' : ''}
          <button class="b g s" onclick="logout()">Keluar</button>
        </span>
      </header>
      <main>${views[view]()}</main>`;
    }

    const go = v => { view = v; rr(); };

    async function login() {
      const u = $('lu').value.trim().toLowerCase();
      const rawPw = $('lp').value;

      if (useBackend) {
        try {
          const resp = await apiReq('/api/auth/login', {
            method: 'POST',
            body: JSON.stringify({ username: u, password: rawPw })
          });
          setApiToken(resp.token);
          me = resp.user;
          const bootData = await apiReq('/api/bootstrap');
          M = bootData.master;
          O = bootData.orders || {};
          V = bootData.invoices || {};
          lsSave();
          view = me.role == 'driver' ? 'drv' : me.role == 'kasir' ? 'inv' : 'dash';
          rr();
          return;
        } catch (e) {
          if ($('le')) $('le').textContent = e.message || 'Username atau password salah.';
          return;
        }
      }

      const h = await H(rawPw);
      const a = M.users.find(x => x.us == u && x.pw == h);
      const d = M.drivers.find(x => x.us.toLowerCase() == u && x.pw == h);
      if (a) me = { role: a.role, us: a.us, n: a.n };
      else if (d) me = { role: 'driver', us: d.us, id: d.id, n: d.n };
      else {
        if ($('le')) $('le').textContent = 'Username atau password salah.';
        return;
      }
      try { sessionStorage.setItem('tms_tok', u + ':' + h.slice(0, 16)); } catch (e) {}
      view = me.role == 'driver' ? 'drv' : me.role == 'kasir' ? 'inv' : 'dash';
      rr();
    }

    function logout() {
      if (useBackend && getApiToken()) {
        apiReq('/api/auth/logout', { method: 'POST' }).catch(() => {});
      }
      setApiToken('');
      me = null;
      lastBell = 0;
      try { sessionStorage.removeItem('tms_tok'); } catch (e) {}
      rr();
    }
