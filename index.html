      <tr><th>SPK</th><th>Jenis</th><th>Tgl & Waktu WIB</th><th>Customer / Sumber</th><th>Alur Rute</th><th>Driver & No. Polisi</th><th>Status</th><th></th></tr>
      ${L.map(o => {
        const j = o.jenis || 'Import';
        const srcTxt = fmtSrcOrder(o);
        return `<tr>
          <td><b>${E(o.spk)}</b></td>
          <td><span class="tag ${jClass(j)}">${E(jLabel(j))}</span></td>
          <td>${E(o.tgl)}<div class="hint">${E(o.createdAt || '')}</div></td>
          <td><b>${E(o.cust)}</b><div class="hint">${srcTxt !== '-' ? 'Sumber: ' + E(srcTxt) : E(o.tipe)}</div></td>
          <td>${E(fmtRute(o))}<div class="hint">${E(o.tipe)}${o.cont ? ' · ' + E(o.cont) : ''}</div></td>
          <td>${E(drvN(o.drv))}<div class="hint">${E(o.trk || '-')}</div></td>
          <td>
            <span class="tag st-${E(o.st)}">${E(o.st)}</span>
            ${hasIssue(o) ? ' <span class="tag" style="background:var(--bad);color:#fff">⚠️ Kendala</span>' : ''}
            ${(o.photos && (o.photos.pod || o.photos.seal)) ? ' 📷' : ''}
            ${o.alasan ? `<div class="hint">${E(o.alasan)}</div>` : ''}
          </td>
          <td><button class="b s g" onclick="openO('${E(o.spk)}')">Buka</button></td>
        </tr>`;
      }).join('')}
    </table></div>` : `<p class="hint">${empty}</p>`;

    const byD = L => L.sort((a, b) => (a.tgl + (a.createdAt || '')) < (b.tgl + (b.createdAt || '')) ? -1 : 1);

    function dash() {
      const A = ALL(), run = byD(A.filter(o => o.st == 'Dispatch')), nx = byD(A.filter(o => o.st == 'Booking')), sa = stnkAlerts();
      const issues = A.filter(o => ['Selesai', 'Ditagih'].includes(o.st) && hasIssue(o));
      const { activeList, standbyList } = getFleetStatus(today());
      const curYm = today().slice(0, 7);
      const pnlNow = getPnlData(curYm);
      const queuedNext = ALL().filter(o => o.st === 'Dispatch' && o.accepted === false).concat(nx);

      const saMonitorHtml = isSA() ? `<div class="card" style="border-top:4px solid var(--ac)">
        <div class="row" style="margin-bottom:10px">
          <div>
            <h2 style="margin:0">Executive Operational & Fleet Command (Superadmin)</h2>
            <div class="hint">Ringkasan performa operasional bulan berjalan (${curYm}), status armada aktif, dan antrean order berikutnya.</div>
          </div>
          <div style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">
            <button class="b s g" onclick="go('pnl')">📊 Buka Laba Rugi</button>
            <button class="b s o" onclick="go('cfg')">⚙️ Pengaturan User</button>
          </div>
        </div>
        <div class="row" style="margin-bottom:10px">
          <div class="stat"><b>${activeList.length} / ${M.trucks.length} Unit</b><span>Armada Berjalan / Total Unit (${standbyList.length} Standby)</span></div>
          <div class="stat warn"><b>${queuedNext.length} Order</b><span>Antrean Order Berikutnya (Menunggu / Draft)</span></div>
          <div class="stat"><b>${R(pnlNow.revNetto)}</b><span>Omzet Trucking Bulan Ini (${pnlNow.doneOrders.length} Trip)</span></div>
          <div class="stat ${pnlNow.netProfit >= 0 ? 'ok' : 'bad'}"><b>${R(pnlNow.netProfit)}</b><span>Estimasi Laba/Rugi Bersih (${curYm})</span></div>
        </div>
      </div>` : '';

      const nextOrdersHtml = `<div class="card">
        <div class="row" style="margin-bottom:8px">
          <div>
            <h2 style="margin:0">Detail Antrean Order Berikutnya (${queuedNext.length})</h2>
            <div class="hint">Mencakup order lanjutan (seperti Repo Container) yang telah di-dispatch ke driver maupun draft booking siap jalan.</div>
          </div>
          <button class="b o" style="margin-left:auto" onclick="newBk()">+ Booking Order Langsung</button>
        </div>
        ${queuedNext.length ? `<div class="tw"><table>
          <tr><th>SPK</th><th>Jenis</th><th>Tgl Muat & Waktu Input</th><th>Customer</th><th>Alur Rute & Container</th><th>Driver & No. Polisi</th><th>Tahap Antrean</th><th></th></tr>
          ${queuedNext.map(o => `<tr>
            <td><b>${E(o.spk)}</b></td>
            <td><span class="tag ${jClass(o.jenis)}">${E(jLabel(o.jenis))}</span></td>
            <td>${E(o.tgl)}<div class="hint">${E(o.createdAt || '-')}</div></td>
            <td><b>${E(o.cust)}</b></td>
            <td>${E(fmtRute(o))}<div class="hint">${E(o.tipe)}${o.cont ? ' · ' + E(o.cont) : ''}</div></td>
            <td><b>${E(drvN(o.drv))}</b><div class="hint">${E(o.trk || '-')}</div></td>
            <td>${o.st === 'Dispatch' ? '<span class="tag st-Dispatch">Antrean Driver (Menunggu Mulai)</span>' : '<span class="tag st-Booking">Draft Booking (Siap Dispatch)</span>'}</td>
            <td><button class="b s g" onclick="openO('${E(o.spk)}')">Detail / Edit</button></td>
          </tr>`).join('')}
        </table></div>` : '<p class="hint">Belum ada antrean order berikutnya.</p>'}
      </div>`;

      return `${sa.length ? `<div class="card" style="border-left:5px solid var(--bad)"><b class="bad">🚨 Peringatan STNK / Pajak Tahunan Armada (${sa.length} Unit):</b><div class="hint">${sa.map(t => { const dp = diffDays(t.pajakDue), ds = diffDays(t.stnkDue); return `<b>${E(t.plat)}</b> (Pajak: ${dp < 0 ? 'EXPIRED ' + Math.abs(dp) + ' hari' : dp + ' hari lagi'} · STNK 5Th: ${ds < 0 ? 'EXPIRED' : ds + ' hari lagi'})`; }).join(' · ')} — <a href="#" onclick="go('mst');return false">Cek Master Armada</a></div></div>` : ''}
      ${issues.length ? `<div class="card" style="border-left:5px solid var(--ac2)"><b style="color:var(--bad)">⚠️ Laporan Kendala Lapangan Driver (${issues.length} Order):</b><div class="hint" style="margin-top:4px">${issues.slice(0, 3).map(o => `<b>${E(o.spk)}</b> (${E(drvN(o.drv))} - ${E(o.drvCond)}): "${E(o.drvReport || '-')}" · <a href="#" onclick="openO('${E(o.spk)}');return false">Buka SPK</a>`).join('<br>')}</div></div>` : ''}
      ${saMonitorHtml}
      <div class="card"><div class="row"><h2 style="margin:0">Ringkasan Operasional</h2><div style="margin-left:auto">${exportBtnsHtml('dash')}</div></div><div class="row" style="margin-top:8px">
        <div class="stat"><b>${run.length}</b><span>Order berjalan</span></div>
        <div class="stat warn"><b>${nx.length}</b><span>Draft booking</span></div>
        <div class="stat"><b>${A.filter(o => (o.jenis || 'Import') == 'Import' && o.st != 'Batal').length} / ${A.filter(o => o.jenis == 'Export' && o.st != 'Batal').length} / ${A.filter(o => o.jenis == 'Repo' && o.st != 'Batal').length}</b><span>Import / Export / Repo</span></div>
        <div class="stat ok"><b>${A.filter(o => o.st == 'Selesai').length}</b><span>Selesai (menunggu kasir)</span></div>
      </div></div>
      ${renderFleetMonitorCard(today())}
      ${nextOrdersHtml}
      <div class="card"><div class="row"><h2 style="margin:0">Order berjalan</h2><button class="b o" style="margin-left:auto" onclick="newBk()">+ Booking order langsung</button></div>${lst(run, 'Tidak ada order yang sedang berjalan.')}</div>`;
    }

    function ord() {
      const q = fSearch.toLowerCase();
      const L = ALL().filter(o => {
        const j = o.jenis || 'Import';
        if (fJenis !== 'ALL' && j !== fJenis) return false;
        if (fStatus !== 'ALL' && o.st !== fStatus) return false;
        if (!q) return true;
        return [o.spk, j, o.cust, fmtSrcOrder(o), o.term, o.t, o.depo, o.cont, o.trk, drvN(o.drv), o.drvCond, o.drvReport]
          .some(x => String(x || '').toLowerCase().includes(q));
      }).sort((a, b) => a.spk < b.spk ? 1 : -1);

      return `<div class="card">
        <div class="row" style="margin-bottom:12px">
          <h2 style="margin:0">Order trucking (SPK)</h2>
          <div style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">
            ${exportBtnsHtml('ord')}
            <button class="b o" onclick="newBk()">+ Booking order langsung</button>
          </div>
        </div>
        <div class="row" style="margin-bottom:12px">
          <label style="flex:2;min-width:200px">Cari SPK / Customer / Sumber Order / Rute / Kendala
            <input value="${E(fSearch)}" placeholder="Ketik kata kunci..." oninput="fSearch=this.value;rr()">
          </label>
          <label style="max-width:180px">Jenis Order<select onchange="fJenis=this.value;rr()">
            <option value="ALL" ${fJenis == 'ALL' ? 'selected' : ''}>Semua Jenis</option>
            <option value="Import" ${fJenis == 'Import' ? 'selected' : ''}>1. Import</option>
            <option value="Export" ${fJenis == 'Export' ? 'selected' : ''}>2. Export</option>
            <option value="Repo" ${fJenis == 'Repo' ? 'selected' : ''}>3. Repo Container</option>
          </select></label>
          <label style="max-width:180px">Filter Status<select onchange="fStatus=this.value;rr()">
            <option value="ALL" ${fStatus == 'ALL' ? 'selected' : ''}>Semua Status (${ALL().length})</option>
            ${[...ST, 'Batal'].map(s => `<option value="${s}" ${fStatus == s ? 'selected' : ''}>${s}</option>`).join('')}
          </select></label>
        </div>
        ${lst(L, 'Tidak ada order yang sesuai filter.')}
      </div>`;
    }

    /* =========================================================================
       BOOKING ORDER LANGSUNG (TANPA PENAWARAN) + SUMBER ORDER + GATEPASS
       ========================================================================= */
    const dl = (id, v) => `<datalist id="${id}">${[...new Set(v.filter(Boolean))].map(x => `<option value="${E(x)}">`).join('')}</datalist>`;

    function buildDriverSelectHtml(id, selectedDrvId, tgl, jenis, exSpk = '', onchangeFn = 'onBkDriverChange()', planStart = '08:00', planHours = 4) {
      return `<select id="${id}" onchange="${onchangeFn}">
        <option value="">– pilih driver (melekat no. polisi) –</option>
        ${M.drivers.map(d => {
          const b = busy('drv', d.id, tgl, exSpk, jenis, planStart, planHours);
          return `<option value="${E(d.id)}" ${selectedDrvId == d.id ? 'selected' : ''} ${b ? 'disabled' : ''}>${E(d.n)} (${E(d.plat)})${b ? ' — sedang ' + b.spk : ''}</option>`;
        }).join('')}
      </select>`;
    }

    function buildTruckSelectHtml(id, selectedPlat, tgl, jenis, exSpk = '', onchangeFn = '', planStart = '08:00', planHours = 4) {
      return `<select id="${id}" ${onchangeFn ? `onchange="${onchangeFn}"` : ''}>
        <option value="">– pilih no. polisi unit –</option>
        ${M.trucks.map(t => {
          const b = busy('trk', t.plat, tgl, exSpk, jenis, planStart, planHours);
          return `<option value="${E(t.plat)}" ${selectedPlat == t.plat ? 'selected' : ''} ${b ? 'disabled' : ''}>${E(t.plat)} (${E(t.jenis)})${b ? ' — sedang ' + b.spk : ''}</option>`;
        }).join('')}
      </select>`;
    }

    function newBk(forcedJenis = '', forcedTgl = '') {
      tmpBkDoc = null;
      const defJenis = forcedJenis || 'Import';
      const defTgl = forcedTgl || today();
      const preDrv = bkPreselect.drv || '';
      const preObj = preDrv ? drvObj(preDrv) : null;
      const preTrk = bkPreselect.trk || (preObj ? preObj.plat : '');
      bkPreselect = { drv: '', trk: '' };

      modal(`<h2>Booking order langsung</h2>
      <p class="hint">Booking langsung diproses tanpa tahap penawaran. Pilih driver (otomatis melekat dengan no. polisi, dan dapat diubah jika driver berhalangan hadir).</p>
      <div class="row">
        <label style="max-width:260px">Jenis Order<select id="f_jenis" onchange="renderRouteFields();refreshBkFleetAndAssign()">
          <option value="Import" ${defJenis == 'Import' ? 'selected' : ''}>1. Import (Terminal → Tujuan → Depo Empty)</option>
          <option value="Export" ${defJenis == 'Export' ? 'selected' : ''}>2. Export (Depo Empty → Tujuan → Terminal)</option>
          <option value="Repo" ${defJenis == 'Repo' ? 'selected' : ''}>3. Repo Container (Terminal ↔ Depo Empty)</option>
        </select></label>
        <label>Customer / Pemilik Order<input id="f_cust" list="lc" oninput="fs()">${dl('lc', M.custs)}</label>
        <label style="max-width:160px">Tanggal muat<input type="date" id="f_tgl" value="${defTgl}" onchange="refreshBkFleetAndAssign()"></label>
        <label style="max-width:130px">Rencana mulai<input type="time" id="f_plan_start" value="08:00" onchange="refreshBkFleetAndAssign()"></label>
        <label style="max-width:150px">Estimasi durasi (jam)<input type="number" id="f_plan_hours" min="0.5" max="24" step="0.5" value="4" onchange="refreshBkFleetAndAssign()"></label>
        <label style="max-width:160px">Tipe trailer<select id="f_tipe" onchange="fs()">${TIPE.map(t => `<option>${t}</option>`).join('')}</select></label>
      </div>

      <div class="route-box" style="margin-top:10px">
        <div class="route-flow">Sumber Order (Opsional)</div>
        <div class="row">
          <label>Nama PIC Sumber Order<input id="f_src_nama" placeholder="Opsional"></label>
          <label>No. Telepon / WA<input id="f_src_telp" placeholder="Opsional"></label>
          <label>Perusahaan / Asal Order<input id="f_src_pt" placeholder="Opsional"></label>
        </div>
      </div>

      <div id="f_route_wrap" class="route-box"></div>

      <div class="route-box" style="margin-top:10px">
        <div class="route-flow">Penugasan Driver & No. Polisi (Bisa Diedit Jika Driver Berhalangan Hadir)</div>
        <div class="row">
          <label>Driver<span id="bk_drv_wrap">${buildDriverSelectHtml('f_drv', preDrv, defTgl, defJenis)}</span></label>
          <label>No. Polisi Unit<span id="bk_trk_wrap">${buildTruckSelectHtml('f_trk', preTrk, defTgl, defJenis)}</span></label>
        </div>
      </div>

      <div class="row" style="margin-top:10px">
        <label>No. container / muatan<input id="f_cont"></label>
        <label>No. seal / BL<input id="f_seal"></label>
        <label style="max-width:120px">Berat (ton)<input type="number" min="0" step="0.1" id="f_ton"></label>
      </div>

      <div class="pbox" style="margin-top:10px">
        <b>Lampiran File Gatepass / Bon Muat Depo (PDF atau Foto — Opsional)</b>
        <input type="file" accept="application/pdf,image/*" style="margin-top:6px" onchange="handleBkDocUpload(this)">
        <div class="hint" id="bk_doc_status">Format didukung: PDF (maks 4 MB) atau Foto (JPG/PNG). Driver dapat membuka & mengunduh file ini.</div>
      </div>

      <label style="margin-top:10px">Catatan operasional<textarea id="f_cat" rows="2"></textarea></label>
      <p class="hint" id="f_sg"></p>
      <div id="bk_fleet_panel" class="route-box" style="margin-top:10px"></div>
      <div class="row" style="margin-top:12px">
        <button class="b" onclick="saveBk(false)">Simpan Booking</button>
        <button class="b o" onclick="saveBk(true)">Simpan & Dispatch Langsung</button>
        <button class="b g" onclick="closeM()">Batal</button>
      </div>`);

      renderRouteFields();
      refreshBkFleetAndAssign();
    }

    async function handleBkDocUpload(el) {
      const file = el.files && el.files[0];
      if (!file) return;
      if ($('bk_doc_status')) $('bk_doc_status').textContent = 'Memproses lampiran...';
      try {
        tmpBkDoc = await readAttachedFile(file);
        if ($('bk_doc_status')) $('bk_doc_status').innerHTML = `<span class="ok">✓ Terlampir: <b>${E(tmpBkDoc.name)}</b> (${tmpBkDoc.sizeKb} KB)</span>`;
      } catch (e) {
        tmpBkDoc = null;
        if ($('bk_doc_status')) $('bk_doc_status').innerHTML = `<span class="bad">${E(e.message)}</span>`;
      }
    }

    function onBkDriverChange() {
      const drvId = $('f_drv') ? $('f_drv').value : '';
      const tgl = $('f_tgl') ? $('f_tgl').value : today();
      const jenis = $('f_jenis') ? $('f_jenis').value : 'Import';
      const planStart = $('f_plan_start') ? $('f_plan_start').value : '08:00';
      const planHours = $('f_plan_hours') ? +$('f_plan_hours').value || 4 : 4;
      if (drvId) {
        const d = drvObj(drvId);
        if (d && d.plat && !busy('trk', d.plat, tgl, '', jenis, planStart, planHours)) {
          $('bk_trk_wrap').innerHTML = buildTruckSelectHtml('f_trk', d.plat, tgl, jenis, '', '', planStart, planHours);
        }
      }
    }

    function refreshBkFleetAndAssign() {
      const tgl = $('f_tgl') ? $('f_tgl').value : today();
      const jenis = $('f_jenis') ? $('f_jenis').value : 'Import';
      const curDrv = $('f_drv') ? $('f_drv').value : '';
      const curTrk = $('f_trk') ? $('f_trk').value : '';
      const planStart = $('f_plan_start') ? $('f_plan_start').value : '08:00';
      const planHours = $('f_plan_hours') ? +$('f_plan_hours').value || 4 : 4;
      if ($('bk_drv_wrap')) $('bk_drv_wrap').innerHTML = buildDriverSelectHtml('f_drv', curDrv, tgl, jenis, '', 'onBkDriverChange()', planStart, planHours);
      if ($('bk_trk_wrap')) $('bk_trk_wrap').innerHTML = buildTruckSelectHtml('f_trk', curTrk, tgl, jenis, '', '', planStart, planHours);

      const { activeList, standbyList } = getFleetStatus(tgl);
      if ($('bk_fleet_panel')) {
        $('bk_fleet_panel').innerHTML = `<div class="route-flow">Ketersediaan Armada & Prediksi Waktu (${E(tgl)}) · ${jenis === 'Repo' ? '<span class="ok">Repo Container: boleh tugaskan armada aktif di hari yang sama</span>' : 'Hanya unit bebas tugas yang dapat dipilih'}</div>
        <div class="hint" style="margin-bottom:6px"><b>Standby / Belum Menerima Order (${standbyList.length}):</b> ${standbyList.length ? standbyList.map(s => `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:8px"><b>${E(s.plat)}</b> (${E(s.drvName)} · ${E(s.state)}) <button type="button" class="b s g" onclick="applyFleetToBk('${E(s.drvId)}','${E(s.plat)}')">Pilih</button></span>`).join('') : 'Tidak ada unit standby.'}</div>
        <div class="hint"><b>Sedang Menjalankan Order (${activeList.length}):</b> ${activeList.length ? activeList.map(a => `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:8px"><b>${E(a.trk)}</b> (${E(a.drvName)} · ${E(a.spk)} · mulai ${E(a.acceptedAt !== '-' ? a.acceptedAt : a.dispatchedAt)} · est. selesai <b>~${E(a.estFinish)}</b>)${jenis === 'Repo' ? ` <button type="button" class="b s o" onclick="applyFleetToBk('${E(a.drvId)}','${E(a.trk)}')">+ Repo</button>` : ''}</span>`).join('') : 'Tidak ada armada aktif.'}</div>`;
      }
      fs();
    }

    function applyFleetToBk(drvId, plat) {
      const tgl = $('f_tgl') ? $('f_tgl').value : today();
      const jenis = $('f_jenis') ? $('f_jenis').value : 'Import';
      const planStart = $('f_plan_start') ? $('f_plan_start').value : '08:00';
      const planHours = $('f_plan_hours') ? +$('f_plan_hours').value || 4 : 4;
      if (drvId && $('bk_drv_wrap')) $('bk_drv_wrap').innerHTML = buildDriverSelectHtml('f_drv', drvId, tgl, jenis, '', 'onBkDriverChange()', planStart, planHours);
      if (plat && $('bk_trk_wrap')) $('bk_trk_wrap').innerHTML = buildTruckSelectHtml('f_trk', plat, tgl, jenis, '', '', planStart, planHours);
      showToast(`Unit ${plat || '-'} dipilih untuk booking ini.`);
    }

    function renderRouteFields() {
      const j = $('f_jenis').value;
      const curTerm = $('f_term') ? $('f_term').value : '';
      const curT = $('f_t') ? $('f_t').value : '';
      const curDepo = $('f_depo') ? $('f_depo').value : '';
      const curDir = $('f_repoDir') ? $('f_repoDir').value : 'T2D';
      const terms = M.routes.map(r => r.term), tujs = M.routes.map(r => r.t), depos = M.routes.map(r => r.depo);

      if (j === 'Repo') {
        $('f_route_wrap').innerHTML = `<div class="route-flow">Alur Rute REPO CONTAINER (Bisa ditugaskan sebagai order lanjutan di hari yang sama)</div>
        <div class="row">
          <label style="max-width:230px">Arah Repo<select id="f_repoDir" onchange="fs()">
            <option value="T2D" ${curDir == 'T2D' ? 'selected' : ''}>A. Terminal → Depo Empty</option>
            <option value="D2T" ${curDir == 'D2T' ? 'selected' : ''}>B. Depo Empty → Terminal</option>
          </select></label>
          <label>Lokasi Terminal<input id="f_term" list="lterm" value="${E(curTerm)}" placeholder="Terminal JICT, Tanjung Priok" oninput="fs()">${dl('lterm', terms)}</label>
          <label>Lokasi Depo Empty<input id="f_depo" list="ldepo" value="${E(curDepo)}" placeholder="Depo Marunda Empty" oninput="fs()">${dl('ldepo', depos)}</label>
        </div>`;
      } else {
        const fTerm = `<label>${j == 'Import' ? '1. Terminal (Asal Muat)' : '3. Terminal (Tujuan Akhir)'}<input id="f_term" list="lterm" value="${E(curTerm)}" placeholder="Terminal JICT, Tanjung Priok" oninput="fs()">${dl('lterm', terms)}</label>`;
        const fTuj = `<label>2. Alamat Tujuan (Gudang)<input id="f_t" list="lt" value="${E(curT)}" placeholder="Kawasan Industri Cikarang" oninput="fs()">${dl('lt', tujs)}</label>`;
        const fDepo = `<label>${j == 'Import' ? '3. Depo Empty (Pengembalian)' : '1. Depo Empty (Ambil Kosong)'}<input id="f_depo" list="ldepo" value="${E(curDepo)}" placeholder="Depo Marunda Empty" oninput="fs()">${dl('ldepo', depos)}</label>`;
        $('f_route_wrap').innerHTML = j == 'Import'
          ? `<div class="route-flow">Alur Rute IMPORT: Terminal → Alamat Tujuan → Depo Empty</div><div class="row">${fTerm}${fTuj}${fDepo}</div>`
          : `<div class="route-flow">Alur Rute EXPORT: Depo Empty → Alamat Tujuan → Terminal</div><div class="row">${fDepo}${fTuj}${fTerm}</div>`;
      }
      fs();
    }

    function fs() {
      if (!$('f_jenis') || !$('f_term') || !$('f_depo') || !$('f_sg')) return;
      const j = $('f_jenis').value, term = $('f_term').value.trim(), depo = $('f_depo').value.trim();
      const t = j === 'Repo' ? 'Repo Container' : ($('f_t') ? $('f_t').value.trim() : '');
      const repoDir = $('f_repoDir') ? $('f_repoDir').value : 'T2D';
      const r = rt(j, term, t, depo, repoDir), i = TIPE.indexOf($('f_tipe').value);
      if (r) {
        if (!depo && r.depo) $('f_depo').value = r.depo;
        if (!term && r.term) $('f_term').value = r.term;
        $('f_sg').innerHTML = `Tarif master <b>${jLabel(j)}</b> ditemukan: ongkos <b>${R(r.c[i])}</b>, uang jalan driver <b>${R(r.u[i])}</b>.`;
      } else {
        $('f_sg').innerHTML = `Rute <b>${jLabel(j)}</b> belum ada di master. Isi ongkos & uang jalan setelah simpan; otomatis terekam ke master.`;
      }
    }

    function nextSpk() {
      const d = today(), p = 'SPK-' + d.slice(2, 4) + d.slice(5, 7) + '-';
      const n = Math.max(0, ...Object.keys(O).filter(k => k.startsWith(p)).map(k => +k.slice(p.length) || 0));
      return p + String(n + 1).padStart(3, '0');
    }

    function saveBk(directDispatch = false) {
      const v = k => $('f_' + k) ? $('f_' + k).value.trim() : '';
      const jenis = v('jenis'), cust = v('cust'), term = v('term'), depo = v('depo'), repoDir = v('repoDir') || 'T2D';
      const t = jenis === 'Repo' ? 'Repo Container' : v('t');
      const drv = v('drv');
      let trk = v('trk');
      const tgl = v('tgl');
      const planStart = v('plan_start') || '08:00';
      const planHours = +v('plan_hours') || 4;
      const startMatch = planStart.match(/^(\d{2}):(\d{2})$/);
      const startMinutes = startMatch ? (+startMatch[1] * 60 + +startMatch[2]) : -1;
      const endMinutes = startMinutes + Math.round(planHours * 60);
      if (startMinutes < 0 || startMinutes >= 1440 || planHours < 0.5 || planHours > 24 || endMinutes >= 1440) return showToast('Jam mulai atau estimasi durasi tidak valid.');
      const planEnd = String(Math.floor(endMinutes / 60)).padStart(2, '0') + ':' + String(endMinutes % 60).padStart(2, '0');

      if (!cust || !term || !depo || (jenis !== 'Repo' && !t)) {
        return showToast('Lengkapi Customer dan seluruh titik rute.');
      }
      if (!trk && drv) {
        const dObj = drvObj(drv);
        if (dObj) trk = dObj.plat;
      }
      if (directDispatch && (!drv || !trk)) {
        return showToast('Pilih Driver dan No. Polisi sebelum Dispatch langsung.');
      }
      if (busy('drv', drv, tgl, '', jenis, planStart, planHours) || busy('trk', trk, tgl, '', jenis, planStart, planHours)) {
        return showToast('Jadwal driver atau unit bentrok. Pilih jam atau armada lain.');
      }

      const tipe = v('tipe'), i = TIPE.indexOf(tipe), r = rt(jenis, term, t, depo, repoDir);
      const ruteLabel = jenis === 'Repo' ? (repoDir === 'D2T' ? `${depo} – ${term}` : `${term} – ${depo}`) : (jenis == 'Export' ? `${depo} – ${t} – ${term}` : `${term} – ${t} – ${depo}`);
      const ts = nowWib();

      const o = {
        spk: nextSpk(), jenis, repoDir: jenis === 'Repo' ? repoDir : '',
        tgl, createdAt: ts,
        planStart, planEnd, planHours,
        dispatchedAt: directDispatch ? ts : '',
        cust,
        srcOrder: { nama: v('src_nama'), telp: v('src_telp'), perusahaan: v('src_pt') },
        a: (jenis == 'Export' || (jenis == 'Repo' && repoDir == 'D2T')) ? depo : term,
        term, t, depo, tipe, cont: v('cont'), seal: v('seal'), ton: v('ton'), cat: v('cat'),
        st: directDispatch ? 'Dispatch' : 'Booking',
        items: [{ n: `Ongkos angkut [${jLabel(jenis)}] ${tipe} (${ruteLabel})`, q: 1, p: r ? r.c[i] : 0 }],
        discType: 'rp', discVal: 0, komisi: 0, ppn: true, pph: false,
        uj: r ? r.u[i] : 0, drv, trk, accepted: false,
        docs: { term: { lokasi: term }, depo: { lokasi: depo } },
        gatepassDoc: tmpBkDoc ? cl(tmpBkDoc) : null,
        photos: {}, drvCond: 'Lancar', drvReport: '', pod: '', tiba: '', drvStep: '', seen: false
      };

      if (!M.custs.includes(o.cust)) M.custs.push(o.cust);
      M.custList = M.custList || [];
      if (!M.custList.some(x => x.n.toLowerCase() === o.cust.toLowerCase())) {
        M.custList.push({ n: o.cust, al: t || depo });
      }
      if (!r) M.routes.push({ jenis, repoDir: o.repoDir, term, t, depo, c: [0, 0, 0, 0], u: [0, 0, 0, 0] });
      pm(); po(o); tmpBkDoc = null;
      closeM();
      openO(o.spk);
      showToast(directDispatch ? `Order ${o.spk} berhasil di-dispatch!` : `Booking ${o.spk} tersimpan.`);
    }

    function sync(o) {
      const j = o.jenis || 'Import', term = o.term || o.a || '', t = o.t || '', depo = o.depo || '', repoDir = o.repoDir || 'T2D';
      let r = rt(j, term, t, depo, repoDir);
      if (!r) { r = { jenis: j, repoDir: j === 'Repo' ? repoDir : '', term, t, depo, c: [0, 0, 0, 0], u: [0, 0, 0, 0] }; M.routes.push(r); }
      const i = TIPE.indexOf(o.tipe);
      if (o.items[0] && o.items[0].p > 0) r.c[i] = o.items[0].p;
      if (o.uj > 0) r.u[i] = o.uj;
      pm();
    }

    const gO = n => O[n];

    /* =========================================================================
       DETAIL SPK & PENGGANTIAN DRIVER / NO. POLISI
       ========================================================================= */
    function openO(n) {
      const o = gO(n), j = o.jenis || 'Import', i = ST.indexOf(o.st), bt = o.st == 'Batal';
      const canEdit = isSA() || o.st === 'Booking';
      const canAssign = isSA() || ['Booking', 'Dispatch'].includes(o.st);
      const r = rt(j, o.term || o.a, o.t, o.depo, o.repoDir), sg = r ? r.u[TIPE.indexOf(o.tipe)] : 0, ph = o.photos || {};
      const srcTxt = fmtSrcOrder(o);

      modal(`<div class="row"><h2 style="margin:0">${E(o.spk)} · <span class="tag ${jClass(j)}">${E(jLabel(j))}</span> · ${E(o.cust)}</h2><button class="b g s" style="margin-left:auto" onclick="closeM()">Tutup</button></div>
      <div class="hint" style="margin-bottom:6px">Dibuat: <b>${E(o.createdAt || o.tgl)}</b>${o.dispatchedAt ? ` · Dispatch: <b>${E(o.dispatchedAt)}</b>` : ''}${o.acceptedAt ? ` · Diterima Driver: <b>${E(o.acceptedAt)}</b>` : ''}${o.finishedAt ? ` · Selesai: <b>${E(o.finishedAt)}</b>` : ''}</div>
      ${bt ? `<p class="bad"><b>Order dibatalkan.</b> ${E(o.alasan || '')}</p>` : `<div class="pipe">${ST.map((s, k) => `<span class="${k < i ? 'd' : k == i ? 'c' : ''}">${s}</span>`).join('')}</div>`}
      <p><b>Alur Rute (${E(jLabel(j))}):</b> ${E(fmtRute(o))}<br>
      Tipe: <b>${E(o.tipe)}</b> · Muat: <b>${E(o.tgl)}</b>${o.cont ? ' · Container: ' + E(o.cont) : ''}${o.seal ? ' · Seal: ' + E(o.seal) : ''}${o.ton ? ' · ' + E(o.ton) + ' ton' : ''}<br>
      Sumber Order: <b>${E(srcTxt)}</b>${o.cat ? '<br>Catatan Admin: ' + E(o.cat) : ''}</p>
      ${renderDocAttachmentBlock(o, false)}

      <h3>Penawaran ongkos</h3>
      <div class="tw"><table>
        <tr><th>Deskripsi biaya</th><th class="n" style="width:70px">Qty</th><th class="n" style="width:150px">Harga satuan</th><th class="n">Jumlah</th><th></th></tr>
        ${o.items.map((it, k) => `<tr>
          <td><input ${canEdit ? '' : 'disabled'} value="${E(it.n)}" onchange="uI('${E(n)}',${k},'n',this.value)"></td>
          <td><input type="number" min="0" ${canEdit ? '' : 'disabled'} value="${it.q}" onchange="uI('${E(n)}',${k},'q',this.value)"></td>
          <td><input type="number" min="0" ${canEdit ? '' : 'disabled'} value="${it.p}" onchange="uI('${E(n)}',${k},'p',this.value)"></td>
          <td class="n">${R(it.q * it.p)}</td>
          <td>${canEdit && k ? `<button class="b s r" onclick="dI('${E(n)}',${k})">×</button>` : ''}</td>
        </tr>`).join('')}
      </table></div>
      ${canEdit ? `<div class="row" style="margin-top:8px">
        <select id="ex" style="max-width:250px">
          <option value="Biaya tambahan|0">Tambah biaya lain…</option>
          <option value="Biaya lift on / lift off|350000">Lift on/off</option>
          <option value="Biaya THC / storage pelabuhan|500000">THC / storage</option>
          <option value="Biaya tol|0">Tol</option>
          <option value="Multi drop (per titik)|250000">Multi drop</option>
          <option value="Biaya bongkar muat|400000">Bongkar muat</option>
          <option value="Demurrage / waktu tunggu|300000">Waktu tunggu / inap</option>
        </select>
        <button class="b g s" onclick="aI('${E(n)}')">+ Tambah baris</button>
      </div>` : ''}

      <div class="row" style="margin-top:10px">
        <label style="max-width:130px">Diskon<select ${canEdit ? '' : 'disabled'} onchange="uF('${E(n)}','discType',this.value)"><option value="rp" ${(o.discType || 'rp') == 'rp' ? 'selected' : ''}>Potongan Rp</option><option value="pct" ${o.discType == 'pct' ? 'selected' : ''}>Persen (%)</option></select></label>
        <label style="max-width:130px">Nilai Diskon<input type="number" min="0" ${canEdit ? '' : 'disabled'} value="${o.discVal || 0}" onchange="uF('${E(n)}','discVal',Math.max(0,+this.value||0))"></label>
        <label style="max-width:150px">Komisi SPK (Rp)<input type="number" min="0" ${canEdit ? '' : 'disabled'} value="${o.komisi || 0}" onchange="uF('${E(n)}','komisi',Math.max(0,+this.value||0))"></label>
      </div>

      <div class="row" style="margin-top:10px">
        <label style="flex:0;min-width:auto;flex-direction:row;align-items:center"><input type="checkbox" style="width:auto" ${o.ppn ? 'checked' : ''} ${canEdit ? '' : 'disabled'} onchange="tg('${E(n)}','ppn',this.checked)"> PPN ${M.set.ppn}%</label>
        <label style="flex:0;min-width:auto;flex-direction:row;align-items:center;white-space:nowrap"><input type="checkbox" style="width:auto" ${o.pph ? 'checked' : ''} ${canEdit ? '' : 'disabled'} onchange="tg('${E(n)}','pph',this.checked)"> PPh 23 ${M.set.pph}%</label>
        <div class="tot">
          <div><span>Subtotal</span><span>${R(grossSub(o))}</span></div>
          ${discAmt(o) ? `<div><span>Diskon</span><span>− ${R(discAmt(o))}</span></div>` : ''}
          <div><span>PPN</span><span>${R(ppn(o))}</span></div>
          ${o.pph ? `<div><span>PPh 23</span><span>− ${R(pph(o))}</span></div>` : ''}
          <div class="g"><span>Total tagihan</span><span>${R(tot(o))}</span></div>
        </div>
      </div>

      ${o.st === 'Dispatch' ? `<h3>Jadwal Operasional SPK</h3>
      <div class="row">
        <label>Jam mulai<input type="time" id="sched_start_${E(n)}" value="${E(o.planStart || '')}" ${canAssign ? '' : 'disabled'}></label>
        <label>Jam selesai<input type="time" id="sched_end_${E(n)}" value="${E(o.planEnd || '')}" ${canAssign ? '' : 'disabled'}></label>
        ${canAssign ? `<button class="b o" onclick="uSched('${E(n)}')">Simpan Jadwal</button>` : ''}
      </div>
      <p class="hint">Jadwal diperlukan untuk menghitung bentrok driver dan unit. SPK Dispatch lama bisa dilengkapi di sini.</p>` : ''}
      <h3>Dispatch, Penggantian Driver / No. Polisi & Uang Jalan</h3>
      <div class="row">
        <label>Driver (Melekat No. Polisi)
          <select ${canAssign ? '' : 'disabled'} onchange="uF('${E(n)}','drv',this.value)">
            <option value="">– pilih driver –</option>
            ${M.drivers.map(d => {
              const b = busy('drv', d.id, o.tgl, o.spk, j, o.planStart || '08:00', o.planHours || 4);
              return `<option value="${E(d.id)}" ${o.drv == d.id ? 'selected' : ''} ${b ? 'disabled' : ''}>${E(d.n)} (${E(d.plat)})${b ? ' — sedang ' + b.spk : ''}</option>`;
            }).join('')}
          </select>
        </label>
        <label>No. Polisi Unit
          <select ${canAssign ? '' : 'disabled'} onchange="uF('${E(n)}','trk',this.value)">
            <option value="">– pilih no. polisi –</option>
            ${M.trucks.map(t => {
              const b = busy('trk', t.plat, o.tgl, o.spk, j, o.planStart || '08:00', o.planHours || 4);
              return `<option value="${E(t.plat)}" ${o.trk == t.plat ? 'selected' : ''} ${b ? 'disabled' : ''}>${E(t.plat)} (${E(t.jenis)})${b ? ' — sedang ' + b.spk : ''}</option>`;
            }).join('')}
          </select>
        </label>
        <label>Uang jalan driver (Rp / trip)<input type="number" min="0" ${canAssign ? '' : 'disabled'} value="${o.uj}" onchange="uF('${E(n)}','uj',Math.max(0,+this.value||0))"></label>
      </div>
      <p class="hint">Saran master (${E(jLabel(j))}): <b>${R(sg)}</b>. ${canAssign ? `<a href="#" onclick="uF('${E(n)}','uj',${sg});return false">Terapkan saran</a> · ` : ''}Jika driver berhalangan hadir, ubah pilihan Driver/No. Polisi di atas. ${j === 'Repo' ? '<b class="ok">Mode Repo Container:</b> Bisa diberikan sebagai order lanjutan di hari yang sama.' : ''}</p>

      ${i >= 2 ? `<h3>Bukti Penyelesaian & Laporan Lapangan Driver</h3>
      <div class="drv-rep ${hasIssue(o) ? 'warn' : ''}">
        <div><b>Situasi Bongkar / Muat:</b> <span class="tag" style="${hasIssue(o) ? 'background:var(--bad);color:#fff' : 'background:var(--ok);color:#fff'}">${E(o.drvCond || 'Lancar')}</span> · Tiba: <b>${E(o.tiba || '-')}</b> · Selesai: <b>${E(o.finishedAt || o.completedAt || '-')}</b></div>
        <div style="margin-top:6px"><b>Catatan / Kendala Driver:</b> ${o.drvReport ? E(o.drvReport) : '<span class="hint">Tidak ada catatan kendala khusus dari driver.</span>'}</div>
      </div>
      ${(ph.pod || ph.seal) ? `<div class="pgrid">
        ${ph.pod ? `<div class="pitem"><b>Foto Surat Jalan / POD</b><img src="${ph.pod}" onclick="viewPhoto('${E(n)}','pod')" title="Klik untuk memperbesar"></div>` : ''}
        ${ph.seal ? `<div class="pitem"><b>Foto Segel / Container</b><img src="${ph.seal}" onclick="viewPhoto('${E(n)}','seal')" title="Klik untuk memperbesar"></div>` : ''}
      </div>` : ''}` : ''}

      <div class="row" style="margin-top:14px">
        ${o.st === 'Booking' ? `<button class="b o" onclick="adv('${E(n)}')">Dispatch ke driver →</button>` : ''}
        ${o.st === 'Dispatch' && isSA() ? `<button class="b g" onclick="fin('${E(n)}')">Tandai selesai (override superadmin)</button>` : ''}
        ${i >= 0 && i < 2 ? `<input id="rs" placeholder="Alasan batal" style="max-width:200px"><button class="b r" onclick="cancelO('${E(n)}')">Batalkan order</button>` : ''}
        ${isSA() ? `<button class="b r" onclick="delO('${E(n)}')">Hapus (superadmin)</button>` : ''}
      </div>`);
    }

    async function uSched(n) {
      if (!canAssign) return showToast('Akses ditolak untuk mengubah jadwal.');
      const o = gO(n);
      const start = $('sched_start_' + n).value;
      const end = $('sched_end_' + n).value;
      const valid = t => /^(?:[01]\\d|2[0-3]):[0-5]\\d$/.test(t || '');
      if (!valid(start) || !valid(end)) return showToast('Isi jam mulai dan jam selesai yang valid.');
      const startMin = (+start.slice(0, 2)) * 60 + (+start.slice(3, 5));
      const endMin = (+end.slice(0, 2)) * 60 + (+end.slice(3, 5));
      if (endMin <= startMin) return showToast('Jam selesai harus setelah jam mulai pada tanggal muat yang sama.');
      const previous = { planStart: o.planStart, planEnd: o.planEnd, planHours: o.planHours };
      o.planStart = start;
      o.planEnd = end;
      o.planHours = (endMin - startMin) / 60;
      if (useBackend && getApiToken()) {
        try {
          await apiReq('/api/orders/' + encodeURIComponent(o.spk), { method: 'PUT', body: JSON.stringify(o) });
        } catch (e) {
          Object.assign(o, previous);
          lsSave(); openO(n);
          return showToast('Jadwal ditolak server: ' + ((e && e.message) || 'Periksa bentrok SPK.'));
        }
        O[o.spk] = o; lsSave();
      } else {
        po(o);
      }
      openO(n);
      showToast('Jadwal SPK diperbarui.');
    }

    function uF(n, k, v) {
      const o = gO(n);
      o[k] = v;
      if (k == 'drv') {
        const d = drvObj(v);
        if (d && d.plat && !busy('trk', d.plat, o.tgl, o.spk, o.jenis, o.planStart || '08:00', o.planHours || 4)) o.trk = d.plat;
        if (o.st === 'Dispatch') { o.seen = false; o.accepted = false; }
      }
      po(o);
      openO(n);
      if (k == 'drv' || k == 'trk') showToast('Penugasan driver & no. polisi diperbarui.');
    }

    function uI(n, k, f, v) { const o = gO(n); o.items[k][f] = f == 'n' ? v : Math.max(0, +v || 0); po(o); if (f != 'n') openO(n); }
    function dI(n, k) { const o = gO(n); o.items.splice(k, 1); po(o); openO(n); }
    function aI(n) { const [a, b] = $('ex').value.split('|'), o = gO(n); o.items.push({ n: a, q: 1, p: +b }); po(o); openO(n); }
    function tg(n, k, v) { const o = gO(n); o[k] = v; po(o); openO(n); }

    function adv(n) {
      const o = gO(n);
      if (o.st === 'Booking') {
        if (!o.drv || !o.trk) return showToast('Pilih driver dan no. polisi unit dulu sebelum dispatch.');
        if (busy('drv', o.drv, o.tgl, n, o.jenis, o.planStart || '08:00', o.planHours || 4) || busy('trk', o.trk, o.tgl, n, o.jenis, o.planStart || '08:00', o.planHours || 4)) {
          return showToast('Jadwal driver atau unit bentrok. Periksa jam rencana SPK.');
        }
        sync(o);
        o.seen = false;
        o.accepted = false;
        o.dispatchedAt = nowWib();
        o.st = 'Dispatch';
        po(o);
        openO(n);
        showToast(`Order ${n} berhasil di-dispatch ke ${drvN(o.drv)} (${o.trk}).`);
      }
    }

    function fin(n) {
      if (!isSA()) return;
      const o = gO(n);
      if (!o || o.st !== 'Dispatch') return;
      const wib = getWibParts();
      o.finishedAt = wib.full;
      o.completedAt = o.completedAt || wib.full;
      o.tiba = o.tiba || wib.iso;
      o.drvStep = '';
      o.drvCond = o.drvCond || 'Lancar';
      o.drvReport = o.drvReport || 'Diselesaikan oleh Superadmin';
      o.st = 'Selesai';
      po(o);
      openO(n);
      showToast(`Order ${n} ditandai Selesai oleh Superadmin.`);
    }

    function cancelO(n) {
      const o = gO(n), a = $('rs').value.trim();
      if (!a) return showToast('Isi alasan batal.');
      o.st = 'Batal'; o.alasan = a; o.canceledAt = nowWib();
      po(o); closeM();
      showToast(`Order ${n} dibatalkan.`);
    }

    function delO(n) {
      if (!isSA()) return;
      delete O[n];
      lsSave();
      if (useBackend && getApiToken()) {
        apiReq('/api/orders/' + encodeURIComponent(n), { method: 'DELETE' }).catch(e => showToast('Sync hapus: ' + e.message));
      }
      closeM();
      showToast(`Order ${n} dihapus permanen.`);
    }

    /* =========================================================================
       UPLOAD DATA TERMINAL, DEPO & FILE GATEPASS / BON MUAT
       ========================================================================= */
    function upl() {
      const L = ALL().filter(o => !['Batal', 'Ditagih'].includes(o.st)).sort((a, b) => a.tgl < b.tgl ? -1 : 1);
      return `<div class="card">
        <div class="row" style="margin-bottom:10px">
          <h2 style="margin:0">Upload data Terminal, Depo Empty & Gatepass / Bon Muat</h2>
          <div style="margin-left:auto">${exportBtnsHtml('upl')}</div>
        </div>
        <div class="tw"><table>
          <tr><th>SPK</th><th>Jenis</th><th>Tgl</th><th>Alur Rute</th><th>Driver / Unit</th><th>Terminal</th><th>Depo Empty</th><th>File Gatepass</th><th></th></tr>
          ${L.map(o => `<tr>
            <td><b>${E(o.spk)}</b></td>
            <td><span class="tag ${jClass(o.jenis)}">${E(jLabel(o.jenis))}</span></td>
            <td>${E(o.tgl)}</td>
            <td>${E(fmtRute(o))}</td>
            <td>${E(drvN(o.drv))}<div class="hint">${E(o.trk || '-')}</div></td>
            <td>${(o.docs.term && o.docs.term.lokasi) ? '<span class="ok">Terisi</span>' : '–'}</td>
            <td>${(o.docs.depo && o.docs.depo.lokasi) ? '<span class="ok">Terisi</span>' : '–'}</td>
            <td>${o.gatepassDoc ? `<span class="ok">📎 ${E(o.gatepassDoc.name)}</span>` : '<span class="hint">Belum ada</span>'}</td>
            <td><button class="b s" onclick="ud('${E(o.spk)}')">Isi / Upload</button></td>
          </tr>`).join('') || '<tr><td colspan="9" class="hint">Belum ada order.</td></tr>'}
        </table></div>
      </div>`;
    }

    const DF = [['lokasi', 'Nama lokasi'], ['alamat', 'Alamat'], ['jam', 'Jam / jadwal'], ['ref', 'No. referensi / DO'], ['cat', 'Catatan']];

    function ud(n) {
      const o = gO(n);
      tmpUplDoc = o.gatepassDoc ? cl(o.gatepassDoc) : null;
      const f = (k, t) => `<div class="tile ${k == 'depo' ? 't2' : ''}"><b>${t}</b>${DF.map(x => `<label>${x[1]}<input id="u_${k}_${x[0]}" value="${E((o.docs[k] || {})[x[0]] || '')}"></label>`).join('')}</div>`;
      modal(`<h2>Data & File untuk driver · ${E(n)} (${E(jLabel(o.jenis))})</h2>
      <p>${E(fmtRute(o))} · driver ${E(drvN(o.drv))} (${E(o.trk || '-')})</p>
      <div class="row">${f('term', 'Terminal')}${f('depo', 'Depo Empty')}</div>
      <div class="pbox" style="margin-top:12px">
        <b>Lampiran File Gatepass / Bon Muat Depo (PDF atau Foto)</b>
        <input type="file" accept="application/pdf,image/*" style="margin-top:6px" onchange="handleUplDocUpload(this)">
        <div class="hint" id="upl_doc_status">${tmpUplDoc ? `<span class="ok">✓ File aktif: <b>${E(tmpUplDoc.name)}</b> (${tmpUplDoc.sizeKb || 0} KB)</span>` : 'Pilih file PDF atau Foto untuk dikirim ke driver.'}</div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="b" onclick="su('${E(n)}')">Simpan & kirim ke driver</button>
        <button class="b g" onclick="closeM()">Batal</button>
      </div>`);
    }

    async function handleUplDocUpload(el) {
      const file = el.files && el.files[0];
      if (!file) return;
      try {
        tmpUplDoc = await readAttachedFile(file);
        if ($('upl_doc_status')) $('upl_doc_status').innerHTML = `<span class="ok">✓ File siap dikirim: <b>${E(tmpUplDoc.name)}</b> (${tmpUplDoc.sizeKb || 0} KB)</span>`;
      } catch (e) {
        if ($('upl_doc_status')) $('upl_doc_status').innerHTML = `<span class="bad">${E(e.message)}</span>`;
      }
    }

    function su(n) {
      const o = gO(n);
      o.docs = o.docs || {};
      ['term', 'depo'].forEach(k => {
        const d = {};
        let any = 0;
        DF.forEach(x => { d[x[0]] = $('u_' + k + '_' + x[0]).value.trim(); if (d[x[0]]) any = 1; });
        if (any) o.docs[k] = d;
        else delete o.docs[k];
      });
      if (tmpUplDoc) o.gatepassDoc = cl(tmpUplDoc);
      tmpUplDoc = null;
      o.seen = false;
      po(o);
      closeM();
      showToast(`Data & file untuk ${n} dikirim ke driver.`);
    }

    /* =========================================================================
       MAINTENANCE (TERMASUK KATEGORI BIAYA LAINNYA)
       ========================================================================= */
    function mnt() {
      const list = (M.expenses || []).sort((a, b) => (b.waktu || b.tgl).localeCompare(a.waktu || a.tgl));
      return `<div class="card">
        <div class="row" style="margin-bottom:8px">
          <div>
            <h2 style="margin:0">Perbaikan Mobil, Maintenance, Sparepart & Biaya Lainnya</h2>
            <div class="hint">Setiap pengeluaran otomatis memotong saldo <b>Top-Up Token Operasional</b> dari Kasir serta masuk ke beban operasional.</div>
          </div>
          <div style="margin-left:auto">${exportBtnsHtml('mnt')}</div>
        </div>
        <div class="row" style="margin-bottom:12px">
          <label style="max-width:150px">Tanggal<input type="date" id="m_tgl" value="${today()}"></label>
          <label style="max-width:150px">Unit Truk<select id="m_trk"><option value="UMUM">Umum / Bengkel</option>${M.trucks.map(t => `<option value="${E(t.plat)}">${E(t.plat)}</option>`).join('')}</select></label>
          <label style="max-width:185px">Kategori<select id="m_kat">
            <option>Perbaikan / Servis</option>
            <option>Pembelian Sparepart</option>
            <option>Ban & Vulkanisir</option>
            <option>Ganti Oli & Filter</option>
            <option>KIR / Pajak / STNK</option>
            <option>Biaya Lainnya</option>
          </select></label>
          <label style="flex:2;min-width:180px">Rincian Pengeluaran<input id="m_ket" placeholder="Contoh: Ganti kampas rem / biaya bongkar darurat"></label>
          <label style="max-width:150px">Biaya (Rp)<input type="number" min="0" id="m_nom"></label>
          <button class="b o" onclick="addMnt()">+ Tambah</button>
        </div>
        <div class="tw"><table>
          <tr><th>Waktu Input (WIB)</th><th>Unit</th><th>Kategori</th><th>Rincian</th><th class="n">Biaya</th><th></th></tr>
          ${list.map(e => `<tr>
            <td>${E(e.waktu || e.tgl)}</td>
            <td><b>${E(e.trk)}</b></td>
            <td><span class="tag">${E(e.kat)}</span></td>
            <td>${E(e.ket)}</td>
            <td class="n">${R(e.nom)}</td>
            <td>${isSA() ? `<button class="b s r" onclick="delMnt('${E(e.id)}')">Hapus</button>` : '<span class="hint">Terkunci</span>'}</td>
          </tr>`).join('') || '<tr><td colspan="6" class="hint">Belum ada catatan maintenance.</td></tr>'}
        </table></div>
      </div>`;
    }

    function addMnt() {
      const tgl = $('m_tgl').value, trk = $('m_trk').value, kat = $('m_kat').value;
      const ket = $('m_ket').value.trim(), nom = Math.max(0, +$('m_nom').value || 0);
      if (!ket || !nom) return showToast('Lengkapi rincian dan nominal biaya.');
      M.expenses = M.expenses || [];
      M.expenses.push({ id: 'EX' + Date.now(), tgl, waktu: nowWib(), trk, kat, ket, nom, oleh: me.n });
      pm(); rr();
      showToast('Catatan pengeluaran tersimpan.');
    }

    function delMnt(id) {
      if (!isSA()) return;
      M.expenses = M.expenses.filter(x => x.id != id);
      pm(); rr();
      showToast('Data pengeluaran dihapus.');
    }

    /* =========================================================================
       MENU DRIVER: ANTREAN BERURUTAN, LIHAT/DOWNLOAD FILE & ALUR 3 TAHAP
       ========================================================================= */
    function drv() {
      const A = ALL().filter(o => o.drv == me.id);
      const run = byD(A.filter(o => o.st == 'Dispatch')).sort((a, b) => (a.planStart || '99:99').localeCompare(b.planStart || '99:99') || a.spk.localeCompare(b.spk));
      const dn = A.filter(o => ['Selesai', 'Ditagih'].includes(o.st))
        .sort((a, b) => (b.finishedAt || b.completedAt || b.tiba || '').localeCompare(a.finishedAt || a.completedAt || a.tiba || ''))
        .slice(0, 8);

      const T = (o, k, t, c) => {
        const d = o.docs[k];
        return `<div class="tile ${c}"><b>${t}</b>${d ? `${E(d.lokasi)}<br>${E(d.alamat || '')}<br>Jam: ${E(d.jam || '-')} · Ref: ${E(d.ref || '-')}${d.cat ? '<br>' + E(d.cat) : ''}` : '<span class="hint">Belum ada data.</span>'}</div>`;
      };

      const renderWizard = o => {
        const step = o.drvStep || 'upload';
        const isUpload = step === 'upload';
        const ph = o.photos || {};
        return `<div class="dc wizard">
          <div class="row">
            <b>${E(o.spk)}</b>
            <span class="tag ${jClass(o.jenis)}">${E(jLabel(o.jenis))}</span>
            <span class="tag st-Dispatch">Proses Penyelesaian Order</span>
            <span class="hint" style="margin-left:auto">Waktu Selesai Terekam: <b>${E(o.completedAt || '-')}</b></span>
          </div>
          <div class="step-bar">
            <div class="done">1. Waktu Selesai Terekam (${E((o.completedAt || '').slice(11, 19) || 'WIB')})</div>
            <div class="${isUpload ? 'act' : 'done'}">2. Upload Foto Surat Jalan / POD</div>
            <div class="${!isUpload ? 'act' : ''}">3. Catatan & Report Admin</div>
          </div>
          ${isUpload ? `
            <h3>Tahap 2: Upload Foto Surat Jalan / POD</h3>
            <p class="hint">Unggah atau ambil foto Surat Jalan / POD untuk order <b>${E(o.spk)}</b> (${E(o.cust)}). Setelah tersimpan, sistem otomatis lanjut ke catatan admin.</p>
            <div class="pbox" style="max-width:420px">
              <b>Foto Surat Jalan / POD</b>
              <input type="file" accept="image/*" capture="environment" style="margin-top:6px" onchange="handleDrvStepPhoto(this,'${E(o.spk)}')">
              <div class="hint" id="drv_st_pod">${ph.pod ? '<span class="ok">✓ Foto POD sudah siap</span>' : 'Ambil foto langsung atau pilih dari galeri'}</div>
              <img id="drv_pv_pod" src="${ph.pod || ''}" style="display:${ph.pod ? 'block' : 'none'}">
            </div>
            <div class="row" style="margin-top:12px">
              <button class="b o" onclick="saveDriverUploadStep('${E(o.spk)}')">Lanjut ke Catatan Admin →</button>
              <button class="b g" onclick="cancelFinishWizard('${E(o.spk)}')">Batalkan Selesai</button>
            </div>
          ` : `
            <h3>Tahap 3: Catatan Situasi Bongkar / Muat & Kendala untuk Admin</h3>
            <p class="hint">Lengkapi situasi bongkar/muat dan catatan kendala untuk order <b>${E(o.spk)}</b>.</p>
            <div class="row">
              <label style="max-width:270px">Situasi Bongkar / Muat<select id="drv_cond_${E(o.spk)}" onchange="onDrvCondChange('${E(o.spk)}')">
                <option value="Lancar" ${(o.drvCond || 'Lancar') == 'Lancar' ? 'selected' : ''}>✅ Lancar / Tanpa Kendala</option>
                <option value="Antre Panjang di Terminal / Depo" ${o.drvCond == 'Antre Panjang di Terminal / Depo' ? 'selected' : ''}>⚠️ Antre Panjang di Terminal / Depo</option>
                <option value="Gudang Bongkar / Muat Padat" ${o.drvCond == 'Gudang Bongkar / Muat Padat' ? 'selected' : ''}>⚠️ Gudang Bongkar / Muat Padat</option>
                <option value="Kendala Dokumen / Seal / DO" ${o.drvCond == 'Kendala Dokumen / Seal / DO' ? 'selected' : ''}>⚠️ Kendala Dokumen / Seal / DO</option>
                <option value="Kendala Teknis Unit / Jalan" ${o.drvCond == 'Kendala Teknis Unit / Jalan' ? 'selected' : ''}>🚨 Kendala Teknis Unit / Jalan</option>
                <option value="Lainnya" ${o.drvCond == 'Lainnya' ? 'selected' : ''}>⚠️ Kendala Lainnya</option>
              </select></label>
              <label style="flex:2;min-width:240px">Catatan Situasi Bongkar / Muat & Kendala<textarea id="drv_rep_${E(o.spk)}" rows="2" placeholder="Tuliskan situasi bongkar/muat atau kendala di lapangan...">${E(o.drvReport || '')}</textarea></label>
            </div>
            <p class="hint" id="drv_rep_hint_${E(o.spk)}">Catatan ini akan tampil sebagai report resmi kepada Admin.</p>
            <div class="row" style="margin-top:12px">
              <button class="b g" onclick="backToDrvUpload('${E(o.spk)}')">← Kembali ke Upload Foto POD</button>
              <button class="b" onclick="submitDriverNoteStep('${E(o.spk)}')">✅ Selesaikan & Kirim ke Admin</button>
            </div>
          `}
        </div>`;
      };

      const card = (o, idx) => {
        if (o.drvStep === 'upload' || o.drvStep === 'note') return renderWizard(o);
        const j = o.jenis || 'Import', acc = o.accepted !== false;
        return `<div class="dc ${!o.seen || !acc ? 'new' : ''}">
          <div class="row">
            <b>${E(o.spk)}</b>
            <span class="tag ${jClass(j)}">${E(jLabel(j))}</span>
            <span class="tag st-Dispatch">${acc ? 'Order Diterima' : 'Order Berikutnya'}</span>
            ${!o.seen ? '<span class="bell">BARU</span>' : ''}
            <span style="margin-left:auto">Muat ${E(o.tgl)} · Jadwal ${E(o.planStart || 'belum dijadwalkan')}–${E(o.planEnd || '-')}</span>
          </div>
          <div class="hint" style="margin-top:4px">Dispatch: ${E(o.dispatchedAt || o.tgl)}${o.acceptedAt ? ` · Diterima: ${E(o.acceptedAt)}` : ''}</div>
          <p><b>${E(o.cust)}</b><br><b>Alur Rute:</b> ${E(fmtRute(o))}<br>${E(o.tipe)} · Unit ${E(o.trk)} · Container ${E(o.cont || '-')}${o.cat ? '<br>Catatan Admin: ' + E(o.cat) : ''}</p>
          <p>Uang jalan: <b>${R(o.uj)}</b></p>
          ${renderDocAttachmentBlock(o, true)}
          <div class="row" style="margin-top:8px">${j == 'Import' ? T(o, 'term', '1. Terminal (Muat)', '') + T(o, 'depo', '3. Depo Empty (Kembali)', 't2') : j == 'Export' ? T(o, 'depo', '1. Depo Empty (Ambil)', 't2') + T(o, 'term', '3. Terminal (Bongkar)', '') : T(o, 'term', 'Terminal', '') + T(o, 'depo', 'Depo Empty', 't2')}</div>
          ${acc ? '<p class="hint" style="margin:8px 0 0"><b>Order sudah diterima. Menunggu order selanjutnya.</b></p>' : ''}
          <div class="row" style="margin-top:12px">
            ${!acc ? `<button class="b" onclick="acceptO('${E(o.spk)}')">✅ Terima Order Ini</button>` : `<button class="b o" onclick="startFinishOrder('${E(o.spk)}')">✅ Selesaikan Order</button>`}
            ${!o.seen && acc ? `<button class="b g" onclick="seen('${E(o.spk)}')">Tandai dibaca</button>` : ''}
          </div>
        </div>`;
      };

      return `<h2>Halo, ${E(me.n)}</h2>
      ${run.length ? run.map((o, i) => card(o, i)).join('') : '<div class="card"><p>Belum ada order aktif untuk Anda.</p></div>'}
      ${dn.length ? `<div class="card"><h3>Riwayat Selesai & Report Lapangan</h3>${dn.map(o => `<div style="padding:8px 0;border-bottom:1px solid var(--ln)">
        <div><b>${E(o.spk)}</b> <span class="tag ${jClass(o.jenis)}">${E(jLabel(o.jenis))}</span> · Selesai: ${E(o.finishedAt || o.completedAt || o.tiba)} · ${E(fmtRute(o))} · <b>${R(o.uj)}</b></div>
        <div class="hint" style="margin-top:3px">Situasi: <b class="${hasIssue(o) ? 'bad' : 'ok'}">${E(o.drvCond || 'Lancar')}</b>${o.drvReport ? ` — "${E(o.drvReport)}"` : ''} ${(o.photos && o.photos.pod) ? '📷 POD' : ''}</div>
      </div>`).join('')}</div>` : ''}`;
    }

    async function acceptO(n) {
      const o = gO(n);
      if (me.role === 'driver' && o.drv !== me.id) return showToast('Bukan order Anda.');
      const previous = { accepted: o.accepted, seen: o.seen, acceptedAt: o.acceptedAt };
      o.accepted = true; o.seen = true; o.acceptedAt = nowWib();

      if (useBackend && getApiToken()) {
        try {
          await apiReq('/api/orders/' + encodeURIComponent(o.spk), { method: 'PUT', body: JSON.stringify(o) });
        } catch (e) {
          o.accepted = previous.accepted;
          o.seen = previous.seen;
          o.acceptedAt = previous.acceptedAt;
          lsSave(); rr();
          return showToast('Gagal menerima order dari server: ' + ((e && e.message) || 'Coba lagi.'));
        }
        O[o.spk] = o;
        lsSave();
      } else {
        po(o);
      }
      rr();
      showToast(`Order ${n} diterima. Order sudah diterima. Menunggu order selanjutnya.`);
    }

    function seen(n) { const o = gO(n); o.seen = true; po(o); }

    function startFinishOrder(n) {
      const o = gO(n);
      if (me.role == 'driver' && o.drv != me.id) return showToast('Bukan order Anda.');
      const wib = getWibParts();
      o.completedAt = wib.full;
      o.tiba = o.tiba || wib.iso;
      o.drvStep = 'upload';
      po(o); rr();
      showToast(`Waktu selesai terekam (${wib.full}). Silakan upload foto Surat Jalan / POD.`);
    }

    function cancelFinishWizard(n) { const o = gO(n); o.drvStep = ''; po(o); rr(); }

    async function handleDrvStepPhoto(el, n) {
      const file = el.files && el.files[0];
      if (!file) return;
      const o = gO(n);
      if ($('drv_st_pod')) $('drv_st_pod').textContent = 'Mengompres foto POD...';
      try {
        const dataUrl = await compressImg(file, 800, 0.7);
        o.photos = o.photos || {};
        o.photos.pod = dataUrl;
        po(o);
        if ($('drv_pv_pod')) { $('drv_pv_pod').src = dataUrl; $('drv_pv_pod').style.display = 'block'; }
        if ($('drv_st_pod')) $('drv_st_pod').innerHTML = '<span class="ok">✓ Foto Surat Jalan / POD siap</span>';
      } catch (e) {
        if ($('drv_st_pod')) $('drv_st_pod').innerHTML = '<span class="bad">Gagal memproses foto</span>';
      }
    }

    function saveDriverUploadStep(n) {
      const o = gO(n);
      const pod = (o.photos && o.photos.pod) || '';
      if (!pod) return showToast('Silakan ambil atau unggah foto Surat Jalan / POD terlebih dahulu.');
      o.drvStep = 'note';
      po(o); rr();
      showToast('Foto POD tersimpan. Silakan isi catatan situasi bongkar/muat untuk Admin.');
    }

    function backToDrvUpload(n) { const o = gO(n); o.drvStep = 'upload'; po(o); rr(); }

    function onDrvCondChange(n) {
      const c = $('drv_cond_' + n).value;
      const h = $('drv_rep_hint_' + n);
      if (h) h.innerHTML = c === 'Lancar' ? 'Catatan situasi bongkar/muat opsional jika berjalan lancar.' : '<b class="bad">Wajib diisi:</b> Jelaskan detail kendala di atas agar admin dapat menindaklanjutinya.';
    }

    function submitDriverNoteStep(n) {
      const o = gO(n);
      const cond = $('drv_cond_' + n).value;
      const rep = $('drv_rep_' + n).value.trim();
      if (cond !== 'Lancar' && !rep) return showToast('Tuliskan rincian kendala / situasi bongkar muat pada catatan.');
      o.drvCond = cond;
      o.drvReport = rep;
      o.finishedAt = nowWib();
      o.completedAt = o.completedAt || o.finishedAt;
      o.tiba = o.tiba || getWibParts().iso;
      o.drvStep = '';
      o.st = 'Selesai';
      po(o); rr();
      showToast(`Order ${n} selesai & report terkirim ke Admin.`);
    }

    /* =========================================================================
       REKON TOKEN OPS (HARIAN, MINGGUAN, BULANAN)
       ========================================================================= */
    function renderRekonView() {
      const mode = window.rekMode || 'bulanan';
      const refDate = window.rekDate || today();
      const refMonth = window.rekMonth || today().slice(0, 7);

      const inRange = dStr => {
        if (!dStr) return false;
        if (mode === 'harian') return dStr === refDate;
        if (mode === 'mingguan') return dStr >= addDays(refDate, -6) && dStr <= refDate;
        return dStr.startsWith(refMonth);
      };

      const labelPeriode = mode === 'harian' ? `Harian (${refDate})` : mode === 'mingguan' ? `Mingguan (${addDays(refDate, -6)} s/d ${refDate})` : `Bulanan (${refMonth})`;
      const topList = (M.topups || []).filter(x => inRange(x.tgl)).sort((a, b) => (b.waktu || b.tgl).localeCompare(a.waktu || a.tgl));
      const ordList = ALL().filter(o => o.st !== 'Batal' && inRange(o.tgl) && o.uj > 0);
      const expList = (M.expenses || []).filter(e => inRange(e.tgl));

      const totTop = topList.reduce((s, x) => s + x.nom, 0);
      const totUj = ordList.reduce((s, o) => s + o.uj, 0);
      const totExp = expList.reduce((s, e) => s + e.nom, 0);
      const totOut = totUj + totExp;
      const selisih = totTop - totOut;
      const noteKey = mode === 'bulanan' ? refMonth : `${mode}_${refDate}`;
      const noteObj = (M.rekonNotes || {})[noteKey] || { cat: '', by: '', at: '' };

      return `<div class="card">
        <div class="row">
          <div>
            <h2 style="margin:0">Rekonsiliasi Dana Operasional (Top-Up Kasir vs Token Admin)</h2>
            <div class="hint">Review mutasi top-up kasir dan pengeluaran operasional admin secara harian, mingguan, maupun bulanan.</div>
          </div>
          <div style="margin-left:auto">${exportBtnsHtml(me.role === 'kasir' ? 'kas' : 'rek')}</div>
        </div>

        <div class="row" style="margin-top:10px">
          <label style="max-width:190px">Metode Review<select onchange="rekMode=this.value;rr()">
            <option value="harian" ${mode == 'harian' ? 'selected' : ''}>Harian</option>
            <option value="mingguan" ${mode == 'mingguan' ? 'selected' : ''}>Mingguan (7 Hari)</option>
            <option value="bulanan" ${mode == 'bulanan' ? 'selected' : ''}>Periode Bulanan</option>
          </select></label>
          ${mode === 'bulanan'
            ? `<label style="max-width:180px">Periode Bulan<input type="month" value="${refMonth}" onchange="rekMonth=this.value;rr()"></label>`
            : `<label style="max-width:180px">Tanggal Acuan<input type="date" value="${refDate}" onchange="rekDate=this.value;rr()"></label>`}
        </div>

        <div class="row" style="margin:14px 0">
          <div class="stat ok"><b>${R(totTop)}</b><span>Total Top-Up Kasir (${E(labelPeriode)})</span></div>
          <div class="stat"><b>${R(totUj)}</b><span>Keluar: Uang Jalan (${ordList.length} SPK)</span></div>
          <div class="stat"><b>${R(totExp)}</b><span>Keluar: Perbaikan & Biaya</span></div>
          <div class="stat ${selisih === 0 ? 'ok' : selisih > 0 ? 'warn' : 'bad'}"><b>${R(selisih)}</b><span>Selisih (${selisih > 0 ? 'Sisa Saldo Token' : selisih < 0 ? 'Kurang / Talangan Admin' : 'Klop / Balance'})</span></div>
        </div>

        <div class="route-box">
          <b>Catatan Selisih & Berita Acara Rekonsiliasi (${E(labelPeriode)})</b>
          <div class="row" style="margin-top:6px">
            <label style="flex:3"><textarea id="rek_cat" rows="2" placeholder="Jelaskan penyebab selisih (misal: sisa saldo mengendap di token admin, bukti nota susulan)...">${E(noteObj.cat || '')}</textarea></label>
            <button class="b o" onclick="saveRekonNote('${E(noteKey)}')">Simpan Catatan Selisih</button>
          </div>
          ${noteObj.at ? `<div class="hint" style="margin-top:4px">Terakhir diperbarui oleh <b>${E(noteObj.by)}</b> pada <b>${E(noteObj.at)}</b></div>` : ''}
        </div>
      </div>

      ${['kasir', 'superadmin'].includes(me.role) ? `<div class="card">

    /* =========================================================================

    function rpt() {
      const mode = window.rptMode || 'harian';
      const d = window.rd || today();
      const ym = window.rymRpt || today().slice(0, 7);
      const f = window.rf || today().slice(0, 8) + '01';
      const t = window.rt2 || today();

      const matchOrder = o => {
        if (!['Selesai', 'Ditagih'].includes(o.st)) return false;
        const tglRef = o.tiba || o.tgl || '';
        if (mode === 'harian') return tglRef === d;
        if (mode === 'bulanan') return tglRef.startsWith(ym);
        return tglRef >= f && tglRef <= t;
      };

      const L = ALL().filter(matchOrder).sort((a, b) => (a.tiba || a.tgl).localeCompare(b.tiba || b.tgl));
      const totPend = L.reduce((s, o) => s + sub(o), 0);
      const totUj = L.reduce((s, o) => s + (+o.uj || 0), 0);
      const totKom = L.reduce((s, o) => s + (+o.komisi || 0), 0);
      const totMargin = totPend - totUj - totKom;

      const labelPeriode = mode === 'harian' ? `Harian (${d})` : mode === 'bulanan' ? `Bulanan (${ym})` : `Periode (${f} s/d ${t})`;

      let html = `<div class="card">

          <div>
            <h2 style="margin:0">Laporan Trucking Operasional</h2>

        <div class="row" style="margin-bottom:12px">
          <label style="max-width:210px">Metode Laporan<select onchange="rptMode=this.value;rr()">
            <option value="harian" ${mode == 'harian' ? 'selected' : ''}>1. Laporan Harian</option>
            <option value="bulanan" ${mode == 'bulanan' ? 'selected' : ''}>2. Laporan Bulanan</option>
            <option value="periode" ${mode == 'periode' ? 'selected' : ''}>3. Metode Periode Tanggal</option>
          </select></label>
          ${mode === 'harian' ? `<label style="max-width:180px">Tanggal Selesai<input type="date" value="${d}" onchange="rd=this.value;rr()"></label>` : ''}
          ${mode === 'bulanan' ? `<label style="max-width:180px">Bulan Laporan<input type="month" value="${ym}" onchange="rymRpt=this.value;rr()"></label>` : ''}

          <tr><th>SPK</th><th>Jenis</th><th>Tgl Selesai & WIB</th><th>Customer / Sumber</th><th>Alur Rute</th><th>Driver / Unit</th><th>Situasi & Kendala</th><th class="n">Pendapatan</th><th class="n">Uang Jalan</th></tr>

            <td><b>${E(o.spk)}</b></td>

            <td>${E(fmtRute(o))}<div class="hint">${E(o.tipe)}</div></td>
            <td>${E(drvN(o.drv))}<div class="hint">${E(o.trk || '-')}</div></td>
            <td><b class="${hasIssue(o) ? 'bad' : 'ok'}">${E(o.drvCond || 'Lancar')}</b>${o.drvReport ? `<div class="hint">${E(o.drvReport)}</div>` : ''}</td>
            <td class="n">${R(sub(o))}</td>
            <td class="n">${R(o.uj)}</td>
          </tr>`).join('') || '<tr><td colspan="9" class="hint">Tidak ada data retase pada periode yang dipilih.</td></tr>'}
        </table></div>
      </div>`;

      if (!isSA()) return html;

      const byJenis = { Import: { n: 0, r: 0, u: 0, k: 0 }, Export: { n: 0, r: 0, u: 0, k: 0 }, Repo: { n: 0, r: 0, u: 0, k: 0 } };
      L.forEach(o => {
        const j = o.jenis || 'Import';
        byJenis[j].n++; byJenis[j].r += sub(o); byJenis[j].u += o.uj; byJenis[j].k += (+o.komisi || 0);

        <div class="tw"><table>
          <tr><th>Jenis Order</th><th class="n">Trip</th><th class="n">Pendapatan</th><th class="n">Uang Jalan</th><th class="n">Komisi</th><th class="n">Margin</th></tr>

    /* =========================================================================

       ========================================================================= */
    function getPnlData(ym) {
      const s = M.set || {};
      const cicilan = +s.cicilanTruk || 0;
      const jmlSupir = s.jmlSupir !== undefined ? +s.jmlSupir : 6;
      const gajiSupirSatuan = s.gajiSupirSatuan !== undefined ? +s.gajiSupirSatuan : 1000000;
      const totGajiSupir = jmlSupir * gajiSupirSatuan;
      const gajiMontir = s.gajiMontir !== undefined ? +s.gajiMontir : 6000000;

      const doneOrders = ALL().filter(o => ['Selesai', 'Ditagih'].includes(o.st) && (o.tiba || o.tgl).startsWith(ym));
      const expList = (M.expenses || []).filter(e => (e.tgl || '').startsWith(ym));

      const revNetto = doneOrders.reduce((sum, o) => sum + sub(o), 0);
      const totUj = doneOrders.reduce((sum, o) => sum + (+o.uj || 0), 0);
      const totKomisi = doneOrders.reduce((sum, o) => sum + (+o.komisi || 0), 0);
      const totMaint = expList.reduce((sum, e) => sum + (+e.nom || 0), 0);

      const directCost = totUj + totKomisi + totMaint;
      const grossProfit = revNetto - directCost;
      const fixedCost = cicilan + totGajiSupir + gajiMontir;
      const netProfit = grossProfit - fixedCost;

      return { ym, doneOrders, expList, revNetto, totUj, totKomisi, totMaint, directCost, grossProfit, cicilan, jmlSupir, gajiSupirSatuan, totGajiSupir, gajiMontir, fixedCost, netProfit };
    }

          <tr style="border-top:2px solid var(--ln)"><td colspan="2"><b>LABA KOTOR OPERASIONAL (A − B)</b></td><td class="n"><b>${R(d.grossProfit)}</b></td></tr>
          <tr style="background:var(--bg)"><td colspan="3"><b>C. BEBAN BIAYA TETAP BULANAN (OVERHEAD ARMADA)</b></td></tr>

    /* =========================================================================
       INVOICE A4 & DATA CUSTOMER (KASIR)
       ========================================================================= */
    function fmtInvRp(n) { return Rplain(n); }

    function terbilangId(num) {
      num = Math.floor(Math.abs(+num || 0));
      if (num === 0) return 'Nol Rupiah';
      const satuan = ['', 'Satu', 'Dua', 'Tiga', 'Empat', 'Lima', 'Enam', 'Tujuh', 'Delapan', 'Sembilan', 'Sepuluh', 'Sebelas'];
      const spell = x => {
        if (x < 12) return satuan[x];
        if (x < 20) return satuan[x - 10] + ' Belas';
        if (x < 100) return satuan[Math.floor(x / 10)] + ' Puluh' + (x % 10 ? ' ' + spell(x % 10) : '');
        if (x < 200) return 'Seratus' + (x % 100 ? ' ' + spell(x % 100) : '');
        if (x < 1000) return satuan[Math.floor(x / 100)] + ' Ratus' + (x % 100 ? ' ' + spell(x % 100) : '');
        if (x < 2000) return 'Seribu' + (x % 1000 ? ' ' + spell(x % 1000) : '');
        if (x < 1000000) return spell(Math.floor(x / 1000)) + ' Ribu' + (x % 1000 ? ' ' + spell(x % 1000) : '');
        if (x < 1000000000) return spell(Math.floor(x / 1000000)) + ' Juta' + (x % 1000000 ? ' ' + spell(x % 1000000) : '');
        return spell(Math.floor(x / 1000000000)) + ' Miliar' + (x % 1000000000 ? ' ' + spell(x % 1000000000) : '');
      };
      return spell(num) + ' Rupiah';
    }

      modal(`<div class="a4-inv">
